<!-- dashboard-toolbar.component.html — v3
     Redesigned: no more glass-topnav bar look. 
     Now renders as a clean sub-header inside the page content area.
     "Dashboard" title on left, Edit/Undo/Redo in middle, Date Range on right.
     LOGIC: 100% unchanged.
-->
<div class="dt-toolbar">
  <!-- Left: Page title -->
  <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0">
    <h1 class="dt-title">Dashboard</h1>

    <!-- Edit Mode Toggle -->
    <button
      (click)="editModeToggle.emit()"
      class="dt-btn"
      [class.dt-btn-active]="isEditMode"
      [title]="isEditMode ? 'Done editing' : 'Edit Layout'"
    >
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        />
      </svg>
      <span class="hidden sm:inline">{{ isEditMode ? 'Done' : 'Edit Layout' }}</span>
    </button>

    <!-- Undo/Redo (edit mode only) -->
    <div *ngIf="isEditMode" style="display: flex; align-items: center; gap: 4px">
      <button
        (click)="undoClick.emit()"
        [disabled]="!canUndo"
        class="dt-icon-btn"
        [class.dt-btn-dim]="!canUndo"
        title="Undo (Ctrl+Z)"
      >
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"
          />
        </svg>
      </button>
      <button
        (click)="redoClick.emit()"
        [disabled]="!canRedo"
        class="dt-icon-btn"
        [class.dt-btn-dim]="!canRedo"
        title="Redo (Ctrl+Shift+Z)"
      >
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Right: Date Range -->
  <div style="position: relative; flex-shrink: 0" #datePickerContainer>
    <button (click)="toggleDatePicker()" class="dt-btn" [title]="getFormattedDateRange()">
      <svg
        width="14"
        height="14"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        style="color: var(--accent-primary); flex-shrink: 0"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <span class="hidden sm:inline">{{ getFormattedDateRange() }}</span>
      <svg
        width="12"
        height="12"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        class="hidden sm:inline"
        style="color: var(--text-muted); transition: transform 0.2s"
        [style.transform]="isDatePickerOpen ? 'rotate(180deg)' : 'rotate(0deg)'"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Date picker dropdown -->
    <div *ngIf="isDatePickerOpen" class="dt-datepicker-drop">
      <app-date-range-picker (dateRangeChange)="onDateRangeChange($event)"></app-date-range-picker>
    </div>
  </div>
</div>
