<div class="h-full flex flex-col" style="background: transparent">
  <!-- Top Action Bar — delegated to DashboardToolbarComponent -->
  <app-dashboard-toolbar
    [isEditMode]="isEditMode"
    [canUndo]="getUndoRedoStatus().canUndo"
    [canRedo]="getUndoRedoStatus().canRedo"
    (editModeToggle)="toggleEditMode()"
    (undoClick)="undo()"
    (redoClick)="redo()"
    (dateRangeChange)="chartDateRanges['global'] = $event"
  >
  </app-dashboard-toolbar>

  <!-- Dashboard Content -->
  <div class="flex-1 px-3 sm:px-4 md:px-6 py-4 sm:py-6 overflow-y-auto overflow-x-hidden">
    <div class="space-y-4 sm:space-y-6 w-full max-w-[1800px] mx-auto">
      <!-- Dashboard Grid -->
      <app-dashboard-grid
        [items]="gridItems"
        [isEditMode]="isEditMode"
        (itemsChange)="onGridItemsChange($event)"
        (itemDelete)="onItemDelete($event)"
        (itemDuplicate)="onItemDuplicate($event)"
        (chartDateRangeClick)="onChartDateRangeClick($event)"
        (widgetClick)="onWidgetClick($event)"
        (editWithAI)="onEditWithAI($event)"
      >
      </app-dashboard-grid>

      <!-- Add Card Button -->
      <div class="mt-6 sm:mt-8 pb-6">
        <button
          (click)="openAiChat()"
          class="w-full glass rounded-xl p-4 sm:p-6 transition-all duration-200 group cursor-pointer flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4"
          style="border: 2px dashed var(--border-subtle) !important"
        >
          <div
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center flex-shrink-0 transition-all duration-200 group-hover:scale-110"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
          >
            <svg
              class="w-5 h-5 sm:w-6 sm:h-6 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
          </div>
          <div class="text-center sm:text-left">
            <p
              class="text-base sm:text-lg font-semibold transition-colors"
              style="color: var(--text-primary)"
            >
              Add New Card
            </p>
            <p class="text-xs sm:text-sm mt-1" style="color: var(--text-muted)">
              Use AI to generate charts and analytics widgets
            </p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- AI Chart Modal -->
  <app-ai-chart-modal
    *ngIf="isAiChatOpen"
    (close)="closeAiChat()"
    (generate)="onChartGenerated($event)"
  >
  </app-ai-chart-modal>

  <!-- Fullscreen Widget Modal -->
  <app-fullscreen-widget-modal
    *ngIf="fullscreenWidget"
    [widget]="fullscreenWidget"
    (close)="closeFullscreen()"
  >
  </app-fullscreen-widget-modal>

  <!-- Edit AI Modal -->
  <app-edit-ai-modal
    *ngIf="showEditAiModal && editingWidget"
    [widget]="editingWidget"
    (close)="closeEditAiModal()"
    (save)="onSaveEditedWidget($event)"
  >
  </app-edit-ai-modal>

  <!-- Chatbot -->
  <app-chatbot
    *ngIf="isChatbotOpen"
    [availableDashboards]="getDashboardsList()"
    [currentDashboardId]="currentDashboardId"
    (close)="toggleChatbot()"
    (createDashboard)="onCreateDashboardFromChat($event)"
    (addChartToDashboard)="onAddChartFromChat($event)"
  ></app-chatbot>

  <!-- Chatbot Toggle Button (when closed) -->
  <button
    *ngIf="!isChatbotOpen"
    (click)="toggleChatbot()"
    class="fixed bottom-4 right-4 w-14 h-14 rounded-full flex items-center justify-center shadow-2xl cursor-pointer transition-transform hover:scale-110 z-[9998]"
    style="background: var(--accent-gradient); color: var(--text-on-accent)"
    title="Open Assistant"
  >
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      ></path>
    </svg>
  </button>
</div>
