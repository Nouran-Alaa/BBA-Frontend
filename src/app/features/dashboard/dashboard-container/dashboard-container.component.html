<!-- dashboard-container.component.html — Space theme
     LOGIC: 100% unchanged. Visual: space/glass theme applied throughout.
-->
<div class="h-full flex flex-col" style="background: transparent">
  <!-- Toolbar -->
  <app-dashboard-toolbar
    [isEditMode]="isEditMode"
    [canUndo]="getUndoRedoStatus().canUndo"
    [canRedo]="getUndoRedoStatus().canRedo"
    (editModeToggle)="toggleEditMode()"
    (undoClick)="undo()"
    (redoClick)="redo()"
    (dateRangeChange)="chartDateRanges['global'] = $event"
  ></app-dashboard-toolbar>

  <!-- Scrollable content -->
  <div class="flex-1 overflow-y-auto overflow-x-hidden px-3 sm:px-4 lg:px-6 py-4 sm:py-5">
    <div class="w-full max-w-[1800px] mx-auto space-y-4 sm:space-y-5">
      <!-- Grid -->
      <app-dashboard-grid
        [items]="gridItems"
        [isEditMode]="isEditMode"
        (itemsChange)="onGridItemsChange($event)"
        (itemDelete)="onItemDelete($event)"
        (itemDuplicate)="onItemDuplicate($event)"
        (chartDateRangeClick)="onChartDateRangeClick($event)"
        (widgetClick)="onWidgetClick($event)"
        (editWithAI)="onEditWithAI($event)"
      ></app-dashboard-grid>

      <!-- Add card area -->
      <div class="pb-6 mt-5 sm:mt-6">
        <!-- Widget type picker (shown when isAddCardOpen) -->
        <div
          *ngIf="isAddCardOpen"
          class="rounded-2xl mb-3 overflow-hidden animate-fadeIn"
          style="
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(24px);
          "
        >
          <p
            class="px-5 pt-4 pb-2 text-[0.60rem] font-bold uppercase tracking-widest"
            style="color: var(--text-muted)"
          >
            Choose widget type
          </p>

          <!-- AI Chart -->
          <button
            (click)="openAiChartModal()"
            class="w-full flex items-center gap-4 px-5 py-3 text-left transition-all hover-glass group"
          >
            <div
              class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110"
              style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
            >
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold" style="color: var(--text-primary)">AI Chart</p>
              <p class="text-xs mt-0.5" style="color: var(--text-muted)">
                Generate analytics with AI
              </p>
            </div>
          </button>

          <!-- News -->
          <button
            (click)="onNewsWidgetAdd()"
            class="w-full flex items-center gap-4 px-5 py-3 text-left transition-all hover-glass group"
            style="border-top: 1px solid var(--border-subtle)"
          >
            <div
              class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110"
              style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
            >
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold" style="color: var(--text-primary)">News Feed</p>
              <p class="text-xs mt-0.5" style="color: var(--text-muted)">
                Responsive grid of news articles
              </p>
            </div>
          </button>

          <!-- Video -->
          <button
            (click)="onVideoWidgetAdd()"
            class="w-full flex items-center gap-4 px-5 py-3 text-left transition-all hover-glass group"
            style="border-top: 1px solid var(--border-subtle)"
          >
            <div
              class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110"
              style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
            >
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold" style="color: var(--text-primary)">Video</p>
              <p class="text-xs mt-0.5" style="color: var(--text-muted)">
                Embed &amp; analyze a video
              </p>
            </div>
          </button>

          <!-- Cancel -->
          <button
            (click)="closeAddCard()"
            class="w-full px-5 py-3 text-left text-xs font-semibold transition-all hover-glass"
            style="color: var(--text-muted); border-top: 1px solid var(--border-subtle)"
          >
            Cancel
          </button>
        </div>

        <!-- Add New Card button -->
        <button
          (click)="openAiChat()"
          class="w-full rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 group cursor-pointer transition-all duration-200"
          style="
            background: var(--bg-card);
            border: 2px dashed var(--border-glass);
            box-shadow: var(--shadow-sm);
          "
          onmouseover="
            this.style.borderColor = 'var(--accent-primary)';
            this.style.boxShadow = '0 0 20px rgba(0,200,255,0.12)';
          "
          onmouseout="
            this.style.borderColor = 'var(--border-glass)';
            this.style.boxShadow = 'var(--shadow-sm)';
          "
        >
          <div
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center flex-shrink-0 transition-transform duration-200 group-hover:scale-110"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
          >
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M12 4v16m8-8H4"
              />
            </svg>
          </div>
          <div class="text-center sm:text-left">
            <p
              class="text-sm sm:text-base font-semibold font-['Exo_2',system-ui]"
              style="color: var(--text-primary)"
            >
              Add New Card
            </p>
            <p class="text-xs mt-0.5" style="color: var(--text-muted)">Chart · News Feed · Video</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Modals — LOGIC UNCHANGED -->
  <app-ai-chart-modal
    *ngIf="isAiChatOpen"
    (close)="closeAiChat()"
    (generate)="onChartGenerated($event)"
  ></app-ai-chart-modal>
  <app-fullscreen-widget-modal
    *ngIf="fullscreenWidget"
    [widget]="fullscreenWidget"
    (close)="closeFullscreen()"
  ></app-fullscreen-widget-modal>
  <app-edit-ai-modal
    *ngIf="showEditAiModal && editingWidget"
    [widget]="editingWidget"
    (close)="closeEditAiModal()"
    (save)="onSaveEditedWidget($event)"
  ></app-edit-ai-modal>
  <app-chatbot
    *ngIf="isChatbotOpen"
    [availableDashboards]="getDashboardsList()"
    [currentDashboardId]="currentDashboardId"
    (close)="toggleChatbot()"
    (createDashboard)="onCreateDashboardFromChat($event)"
    (addChartToDashboard)="onAddChartFromChat($event)"
  ></app-chatbot>

  <!-- Chatbot FAB -->
  <button
    *ngIf="!isChatbotOpen"
    (click)="toggleChatbot()"
    class="fixed bottom-5 right-5 w-13 h-13 rounded-full flex items-center justify-center cursor-pointer transition-all duration-200 hover:scale-110 z-[9998]"
    style="
      width: 52px;
      height: 52px;
      background: var(--accent-gradient);
      color: #fff;
      box-shadow:
        0 0 24px rgba(0, 200, 255, 0.45),
        var(--shadow-lg);
    "
    title="Open Assistant"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      />
    </svg>
  </button>
</div>
