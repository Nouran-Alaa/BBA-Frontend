<div class="h-full flex flex-col" style="background: transparent">
  <!-- Top Action Bar — delegated to DashboardToolbarComponent -->
  <app-dashboard-toolbar
    [isEditMode]="isEditMode"
    [canUndo]="getUndoRedoStatus().canUndo"
    [canRedo]="getUndoRedoStatus().canRedo"
    (editModeToggle)="toggleEditMode()"
    (undoClick)="undo()"
    (redoClick)="redo()"
    (dateRangeChange)="chartDateRanges['global'] = $event"
  >
  </app-dashboard-toolbar>

  <!-- Dashboard Content -->
  <div class="flex-1 px-3 sm:px-4 md:px-6 py-4 sm:py-6 overflow-y-auto overflow-x-hidden">
    <div class="space-y-4 sm:space-y-6 w-full max-w-[1800px] mx-auto">
      <!-- Dashboard Grid -->
      <app-dashboard-grid
        [items]="gridItems"
        [isEditMode]="isEditMode"
        (itemsChange)="onGridItemsChange($event)"
        (itemDelete)="onItemDelete($event)"
        (itemDuplicate)="onItemDuplicate($event)"
        (chartDateRangeClick)="onChartDateRangeClick($event)"
        (widgetClick)="onWidgetClick($event)"
        (editWithAI)="onEditWithAI($event)"
      >
      </app-dashboard-grid>

      <!-- Add Card Button -->
      <div class="mt-6 sm:mt-8 pb-6">
        <!-- Picker dropdown -->
        <div
          *ngIf="isAddCardOpen"
          class="glass rounded-xl mb-3 overflow-hidden"
          style="border: 1px solid var(--border-subtle)"
        >
          <p
            class="text-xs font-semibold uppercase tracking-widest px-5 pt-4 pb-2"
            style="color: var(--text-muted)"
          >
            Choose widget type
          </p>

          <!-- AI Chart -->
          <button
            (click)="openAiChartModal()"
            class="w-full flex items-center gap-4 px-5 py-3 transition-colors text-left hover-glass"
          >
            <div
              class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
              style="background: var(--accent-gradient)"
            >
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold" style="color: var(--text-primary)">AI Chart</p>
              <p class="text-xs" style="color: var(--text-muted)">Generate analytics with AI</p>
            </div>
          </button>

          <!-- News Widget -->
          <button
            (click)="onNewsWidgetAdd()"
            class="w-full flex items-center gap-4 px-5 py-3 transition-colors text-left hover-glass"
          >
            <div
              class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
              style="background: var(--accent-gradient)"
            >
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold" style="color: var(--text-primary)">News Feed</p>
              <p class="text-xs" style="color: var(--text-muted)">
                Responsive grid of news articles
              </p>
            </div>
          </button>

          <!-- Video Widget -->
          <button
            (click)="onVideoWidgetAdd()"
            class="w-full flex items-center gap-4 px-5 py-3 transition-colors text-left hover-glass"
          >
            <div
              class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
              style="background: var(--accent-gradient)"
            >
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold" style="color: var(--text-primary)">Video</p>
              <p class="text-xs" style="color: var(--text-muted)">Embed & analyze a video</p>
            </div>
          </button>

          <!-- Cancel -->
          <button
            (click)="closeAddCard()"
            class="w-full px-5 py-3 text-xs font-semibold text-left transition-colors hover-glass"
            style="color: var(--text-muted); border-top: 1px solid var(--border-subtle)"
          >
            Cancel
          </button>
        </div>

        <!-- The main + button -->
        <button
          (click)="openAiChat()"
          class="w-full glass rounded-xl p-4 sm:p-6 transition-all duration-200 group cursor-pointer flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4"
          style="border: 2px dashed var(--border-subtle) !important"
        >
          <div
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center flex-shrink-0 transition-all duration-200 group-hover:scale-110"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
          >
            <svg
              class="w-5 h-5 sm:w-6 sm:h-6 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
          </div>
          <div class="text-center sm:text-left">
            <p class="text-base sm:text-lg font-semibold" style="color: var(--text-primary)">
              Add New Card
            </p>
            <p class="text-xs sm:text-sm mt-1" style="color: var(--text-muted)">
              Chart · News Feed · Video
            </p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- AI Chart Modal -->
  <app-ai-chart-modal
    *ngIf="isAiChatOpen"
    (close)="closeAiChat()"
    (generate)="onChartGenerated($event)"
  >
  </app-ai-chart-modal>

  <!-- Fullscreen Widget Modal -->
  <app-fullscreen-widget-modal
    *ngIf="fullscreenWidget"
    [widget]="fullscreenWidget"
    (close)="closeFullscreen()"
  >
  </app-fullscreen-widget-modal>

  <!-- Edit AI Modal -->
  <app-edit-ai-modal
    *ngIf="showEditAiModal && editingWidget"
    [widget]="editingWidget"
    (close)="closeEditAiModal()"
    (save)="onSaveEditedWidget($event)"
  >
  </app-edit-ai-modal>

  <!-- Chatbot -->
  <app-chatbot
    *ngIf="isChatbotOpen"
    [availableDashboards]="getDashboardsList()"
    [currentDashboardId]="currentDashboardId"
    (close)="toggleChatbot()"
    (createDashboard)="onCreateDashboardFromChat($event)"
    (addChartToDashboard)="onAddChartFromChat($event)"
  ></app-chatbot>

  <!-- Chatbot Toggle Button (when closed) -->
  <button
    *ngIf="!isChatbotOpen"
    (click)="toggleChatbot()"
    class="fixed bottom-4 right-4 w-14 h-14 rounded-full flex items-center justify-center shadow-2xl cursor-pointer transition-transform hover:scale-110 z-[9998]"
    style="background: var(--accent-gradient); color: var(--text-on-accent)"
    title="Open Assistant"
  >
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      ></path>
    </svg>
  </button>
</div>
