<div class="h-full flex flex-col" style="background: transparent">
  <!-- Top Action Bar -->
  <div class="glass-topnav px-4 md:px-6 py-4 flex-shrink-0">
    <div class="flex items-center justify-between gap-3">
      <!-- Left: Dashboard Title + Edit Mode Toggle + Undo/Redo -->
      <div class="flex items-center gap-3 flex-1 min-w-0">
        <h1 class="text-xl md:text-2xl font-bold truncate" style="color: var(--text-primary)">
          Dashboard
        </h1>

        <!-- Edit Mode Toggle -->
        <button
          (click)="toggleEditMode()"
          class="px-3 md:px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 hover:shadow-md flex items-center gap-2 flex-shrink-0 cursor-pointer"
          [style.background]="isEditMode ? 'var(--accent-gradient)' : 'var(--bg-overlay)'"
          [style.color]="isEditMode ? 'var(--text-on-accent)' : 'var(--text-primary)'"
          [style.border]="'1px solid ' + (isEditMode ? 'transparent' : 'var(--border-subtle)')"
          [title]="isEditMode ? 'Done' : 'Edit Layout'"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            ></path>
          </svg>
          <span class="hidden md:inline">{{ isEditMode ? 'Done' : 'Edit Layout' }}</span>
        </button>

        <!-- Undo/Redo Buttons (Edit Mode Only) -->
        <div *ngIf="isEditMode" class="flex items-center gap-2">
          <!-- Undo Button -->
          <button
            (click)="undo()"
            [disabled]="!getUndoRedoStatus().canUndo"
            class="p-2 rounded-lg transition-all duration-200 cursor-pointer group relative"
            [class.opacity-30]="!getUndoRedoStatus().canUndo"
            [class.cursor-not-allowed]="!getUndoRedoStatus().canUndo"
            style="
              background: var(--bg-overlay);
              color: var(--text-primary);
              border: 1px solid var(--border-subtle);
            "
            onmouseover="
              if (!this.disabled) {
                this.style.background = 'var(--bg-card)';
                this.style.borderColor = 'var(--accent-primary)';
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = 'var(--shadow-md)';
              }
            "
            onmouseout="
              this.style.background = 'var(--bg-overlay)';
              this.style.borderColor = 'var(--border-subtle)';
              this.style.transform = 'translateY(0)';
              this.style.boxShadow = 'none';
            "
            title="Undo (Ctrl+Z)"
          >
            <svg
              class="w-5 h-5 transition-transform group-hover:scale-110"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"
              ></path>
            </svg>
            <!-- Tooltip -->
            <span
              *ngIf="getUndoRedoStatus().canUndo"
              class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-1 text-xs font-medium whitespace-nowrap rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
              style="
                background: var(--bg-tooltip);
                color: var(--text-on-accent);
                box-shadow: var(--shadow-lg);
              "
            >
              Undo
            </span>
          </button>

          <!-- Redo Button -->
          <button
            (click)="redo()"
            [disabled]="!getUndoRedoStatus().canRedo"
            class="p-2 rounded-lg transition-all duration-200 cursor-pointer group relative"
            [class.opacity-30]="!getUndoRedoStatus().canRedo"
            [class.cursor-not-allowed]="!getUndoRedoStatus().canRedo"
            style="
              background: var(--bg-overlay);
              color: var(--text-primary);
              border: 1px solid var(--border-subtle);
            "
            onmouseover="
              if (!this.disabled) {
                this.style.background = 'var(--bg-card)';
                this.style.borderColor = 'var(--accent-primary)';
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = 'var(--shadow-md)';
              }
            "
            onmouseout="
              this.style.background = 'var(--bg-overlay)';
              this.style.borderColor = 'var(--border-subtle)';
              this.style.transform = 'translateY(0)';
              this.style.boxShadow = 'none';
            "
            title="Redo (Ctrl+Shift+Z)"
          >
            <svg
              class="w-5 h-5 transition-transform group-hover:scale-110"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"
              ></path>
            </svg>
            <!-- Tooltip -->
            <span
              *ngIf="getUndoRedoStatus().canRedo"
              class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-1 text-xs font-medium whitespace-nowrap rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
              style="
                background: var(--bg-tooltip);
                color: var(--text-on-accent);
                box-shadow: var(--shadow-lg);
              "
            >
              Redo
            </span>
          </button>
        </div>
      </div>

      <!-- Right: Date Range Picker Button -->
      <div class="relative flex-shrink-0" #datePickerContainer>
        <button
          (click)="toggleDatePicker()"
          class="flex items-center gap-2 px-3 md:px-4 py-2 rounded-lg transition-colors duration-200 focus:outline-none cursor-pointer hover-glass"
          style="
            background: var(--bg-overlay);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
          "
          [title]="getFormattedDateRange()"
        >
          <svg
            class="w-5 h-5"
            style="color: var(--accent-primary)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          <span class="text-sm font-medium hidden md:inline">{{ getFormattedDateRange() }}</span>
          <svg
            class="w-4 h-4 transition-transform hidden md:inline"
            [class.rotate-180]="isDatePickerOpen"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            style="color: var(--text-muted)"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </button>

        <div
          *ngIf="isDatePickerOpen"
          class="absolute right-0 mt-2 z-50 glass-dropdown rounded-xl overflow-hidden animate-fadeIn"
        >
          <app-date-range-picker (dateRangeChange)="onDateRangeChange($event)">
          </app-date-range-picker>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="flex-1 px-3 sm:px-4 md:px-6 py-4 sm:py-6 overflow-y-auto overflow-x-hidden">
    <div class="space-y-4 sm:space-y-6 w-full max-w-[1800px] mx-auto">
      <!-- Dashboard Grid -->
      <app-dashboard-grid
        [items]="gridItems"
        [isEditMode]="isEditMode"
        (itemsChange)="onGridItemsChange($event)"
        (itemDelete)="onItemDelete($event)"
        (itemDuplicate)="onItemDuplicate($event)"
        (chartDateRangeClick)="onChartDateRangeClick($event)"
        (widgetClick)="onWidgetClick($event)"
        (editWithAI)="onEditWithAI($event)"
      >
      </app-dashboard-grid>

      <!-- Add Card Button -->
      <div class="mt-6 sm:mt-8 pb-6">
        <button
          (click)="openAiChat()"
          class="w-full glass rounded-xl p-4 sm:p-6 transition-all duration-200 group cursor-pointer flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4"
          style="border: 2px dashed var(--border-subtle) !important"
        >
          <div
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center flex-shrink-0 transition-all duration-200 group-hover:scale-110"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
          >
            <svg
              class="w-5 h-5 sm:w-6 sm:h-6 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
          </div>
          <div class="text-center sm:text-left">
            <p
              class="text-base sm:text-lg font-semibold transition-colors"
              style="color: var(--text-primary)"
            >
              Add New Card
            </p>
            <p class="text-xs sm:text-sm mt-1" style="color: var(--text-muted)">
              Use AI to generate charts and analytics widgets
            </p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- AI Chart Modal -->
  <app-ai-chart-modal
    *ngIf="isAiChatOpen"
    (close)="closeAiChat()"
    (generate)="onChartGenerated($event)"
  >
  </app-ai-chart-modal>

  <app-fullscreen-widget-modal
    *ngIf="fullscreenWidget"
    [widget]="fullscreenWidget"
    (close)="closeFullscreen()"
  >
  </app-fullscreen-widget-modal>

  <!-- Edit AI Modal -->
  <app-edit-ai-modal
    *ngIf="showEditAiModal && editingWidget"
    [widget]="editingWidget"
    (close)="closeEditAiModal()"
    (save)="onSaveEditedWidget($event)"
  >
  </app-edit-ai-modal>

  <!-- Chatbot -->
  <app-chatbot
    *ngIf="isChatbotOpen"
    [availableDashboards]="getDashboardsList()"
    [currentDashboardId]="currentDashboardId"
    (close)="toggleChatbot()"
    (createDashboard)="onCreateDashboardFromChat($event)"
  ></app-chatbot>

  <!-- Chatbot Toggle Button (when closed) -->
  <button
    *ngIf="!isChatbotOpen"
    (click)="toggleChatbot()"
    class="fixed bottom-4 right-4 w-14 h-14 rounded-full flex items-center justify-center shadow-2xl cursor-pointer transition-transform hover:scale-110 z-[9998]"
    style="background: var(--accent-gradient); color: var(--text-on-accent)"
    title="Open Assistant"
  >
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      ></path>
    </svg>
  </button>
</div>
