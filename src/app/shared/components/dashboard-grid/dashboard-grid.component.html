<!-- dashboard-grid.component.html — Space theme
     LOGIC: 100% unchanged. Tailwind classes updated to use space/glass vars.
     Responsive: 1 col mobile → 6 col tablet → 12 col desktop
-->
<div
  cdkDropList
  cdkDropListSortingDisabled
  [cdkDropListData]="items"
  (cdkDropListDropped)="drop($event)"
  class="grid gap-3 sm:gap-4 md:gap-5 grid-cols-1 md:grid-cols-6 lg:grid-cols-12"
  [ngStyle]="{
    'grid-template-columns': 'repeat(12, 1fr)',
    'grid-auto-rows': '120px',
  }"
>
  <div
    *ngFor="let item of items"
    cdkDrag
    [cdkDragData]="item"
    [cdkDragDisabled]="!isEditMode"
    (cdkDragStarted)="onDragStarted($event)"
    (cdkDragMoved)="onDragMoved($event)"
    (cdkDragEnded)="onDragEnded()"
    [style.grid-column]="(item.colStart ?? 0) + 1 + ' / span ' + item.colSpan"
    [style.grid-row]="(item.rowStart ?? 0) + 1 + ' / span ' + item.rowSpan"
    class="relative group h-full"
  >
    <!-- Drag Preview -->
    <ng-template cdkDragPreview>
      <div
        class="rounded-2xl p-4 shadow-2xl opacity-90"
        [style.width.px]="item.colSpan * 100"
        [style.height.px]="item.rowSpan * 120"
        style="
          background: var(--bg-card);
          border: 2px solid var(--accent-primary);
          backdrop-filter: blur(24px);
        "
      >
        <h3 class="text-sm font-semibold truncate" style="color: var(--text-primary)">
          {{ item.title }}
        </h3>
      </div>
    </ng-template>

    <!-- Drag handle (edit mode) -->
    <div
      *ngIf="isEditMode"
      cdkDragHandle
      class="absolute top-2.5 left-2.5 z-20 cursor-move opacity-0 group-hover:opacity-100 transition-opacity rounded-lg p-1.5 shadow-lg"
      style="background: var(--accent-gradient); color: #fff"
      title="Drag to reorder"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" />
      </svg>
    </div>

    <!-- Widget menu (edit mode) -->
    <div
      *ngIf="isEditMode"
      class="absolute top-2.5 right-2.5 z-20 opacity-0 group-hover:opacity-100 transition-opacity"
    >
      <app-widget-menu
        [isOpen]="activeWidgetMenu === item.id"
        (toggle)="toggleWidgetMenu(item.id, $event)"
        (duplicate)="duplicateItem(item.id); activeWidgetMenu = null"
        (delete)="deleteItem(item.id); activeWidgetMenu = null"
      ></app-widget-menu>
    </div>

    <!-- Resize handles (edit mode) -->
    <ng-container *ngIf="isEditMode">
      <div class="resize-handle resize-n" (mousedown)="onResizeStart(item, 'n', $event)"></div>
      <div class="resize-handle resize-e" (mousedown)="onResizeStart(item, 'e', $event)"></div>
      <div class="resize-handle resize-s" (mousedown)="onResizeStart(item, 's', $event)"></div>
      <div class="resize-handle resize-w" (mousedown)="onResizeStart(item, 'w', $event)"></div>
      <div
        class="resize-handle resize-corner resize-ne"
        (mousedown)="onResizeStart(item, 'ne', $event)"
      ></div>
      <div
        class="resize-handle resize-corner resize-se"
        (mousedown)="onResizeStart(item, 'se', $event)"
      ></div>
      <div
        class="resize-handle resize-corner resize-sw"
        (mousedown)="onResizeStart(item, 'sw', $event)"
      ></div>
      <div
        class="resize-handle resize-corner resize-nw"
        (mousedown)="onResizeStart(item, 'nw', $event)"
      ></div>
    </ng-container>

    <!-- Card container -->
    <div
      (click)="onWidgetClick(item)"
      [class.cursor-pointer]="!isEditMode"
      class="h-full rounded-2xl transition-all duration-200 overflow-visible relative card-hover glass-nofilter"
      [style.border]="isEditMode ? '2px solid var(--accent-primary)' : ''"
      [style.box-shadow]="isEditMode ? '0 0 0 2px var(--accent-primary), var(--shadow-card)' : ''"
    >
      <!-- Card actions (non-edit mode) -->
      <div *ngIf="!isEditMode" class="absolute top-2 right-2 z-10">
        <app-card-actions
          [itemId]="item.id"
          [itemType]="item.type"
          [isActive]="activeChartDateMenu === item.id"
          [datePickerPosition]="datePickerPosition"
          (editClick)="onEditWithAI(item.id, $event)"
          (dateClick)="toggleChartDateMenu(item.id, $event)"
          (dateRangeChange)="onChartDateRangeSelected(item.id, $event)"
        ></app-card-actions>
      </div>

      <app-dashboard-card [item]="item" [isEditMode]="isEditMode"></app-dashboard-card>
    </div>

    <!-- CDK drag placeholder -->
    <div
      *cdkDragPlaceholder
      class="rounded-2xl opacity-50"
      style="border: 3px dashed var(--accent-primary); background: var(--bg-overlay)"
    ></div>
  </div>
</div>
