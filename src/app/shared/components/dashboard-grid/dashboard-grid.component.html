<div
  cdkDropList
  cdkDropListSortingDisabled
  [cdkDropListData]="items"
  (cdkDropListDropped)="drop($event)"
  class="grid gap-3 sm:gap-4 md:gap-6"
  [ngClass]="{
    'grid-cols-1': true,
    'sm:grid-cols-2': true,
    'md:grid-cols-4': true,
    'lg:grid-cols-8': true,
    'xl:grid-cols-12': true,
  }"
  [ngStyle]="{
    'grid-auto-rows': isEditMode ? '120px' : 'minmax(140px, auto)',
  }"
>
  <div
    *ngFor="let item of items"
    cdkDrag
    [cdkDragData]="item"
    [cdkDragDisabled]="!isEditMode"
    (cdkDragStarted)="onDragStarted($event)"
    (cdkDragMoved)="onDragMoved($event)"
    (cdkDragEnded)="onDragEnded()"
    [style.grid-column]="(item.colStart ?? 0) + 1 + ' / span ' + item.colSpan"
    [style.grid-row]="(item.rowStart ?? 0) + 1 + ' / span ' + item.rowSpan"
    class="relative group"
  >
    <ng-template cdkDragPreview>
      <div
        class="glass rounded-xl p-4 shadow-2xl opacity-90"
        [style.width.px]="item.colSpan * 100"
        [style.height.px]="item.rowSpan * 120"
        style="background: var(--bg-card); border: 2px solid var(--accent-primary)"
      >
        <h3 class="font-semibold text-sm" style="color: var(--text-primary)">{{ item.title }}</h3>
      </div>
    </ng-template>

    <!-- Drag Handle (Edit Mode Only) -->
    <div
      *ngIf="isEditMode"
      cdkDragHandle
      class="absolute top-3 left-3 z-20 cursor-move opacity-0 group-hover:opacity-100 transition-opacity rounded-lg shadow-lg p-2"
      style="background: var(--accent-gradient); color: var(--text-on-accent)"
      title="Drag to reorder"
    >
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 8h16M4 16h16"
        ></path>
      </svg>
    </div>

    <!-- Menu Button (Edit Mode Only) -->
    <div
      *ngIf="isEditMode"
      class="absolute top-3 right-3 z-20 opacity-0 group-hover:opacity-100 transition-opacity"
    >
      <div class="relative">
        <button
          (click)="toggleWidgetMenu(item.id, $event)"
          class="p-2 bg-white rounded-lg shadow-lg hover-glass transition-colors border border-gray-200"
          title="Widget options"
        >
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"
            ></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div
          *ngIf="activeWidgetMenu === item.id"
          class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-gray-200 py-1 z-30"
        >
          <button
            (click)="duplicateItem(item.id, $event); activeWidgetMenu = null"
            class="w-full flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover-glass transition-colors text-left"
          >
            <svg
              class="w-4 h-4 text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
              ></path>
            </svg>
            Duplicate
          </button>
          <button
            (click)="deleteItem(item.id, $event); activeWidgetMenu = null"
            class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-100/20 transition-colors text-left"
          >
            <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              ></path>
            </svg>
            Delete
          </button>
        </div>
      </div>
    </div>

    <!-- Resize Handles (Edit Mode Only) -->
    <ng-container *ngIf="isEditMode">
      <div class="resize-handle resize-n" (mousedown)="onResizeStart(item, 'n', $event)"></div>
      <div class="resize-handle resize-e" (mousedown)="onResizeStart(item, 'e', $event)"></div>
      <div class="resize-handle resize-s" (mousedown)="onResizeStart(item, 's', $event)"></div>
      <div class="resize-handle resize-w" (mousedown)="onResizeStart(item, 'w', $event)"></div>

      <div
        class="resize-handle resize-corner resize-ne"
        (mousedown)="onResizeStart(item, 'ne', $event)"
      ></div>
      <div
        class="resize-handle resize-corner resize-se"
        (mousedown)="onResizeStart(item, 'se', $event)"
      ></div>
      <div
        class="resize-handle resize-corner resize-sw"
        (mousedown)="onResizeStart(item, 'sw', $event)"
      ></div>
      <div
        class="resize-handle resize-corner resize-nw"
        (mousedown)="onResizeStart(item, 'nw', $event)"
      ></div>
    </ng-container>

    <!-- Card Content -->
    <div
      (click)="onWidgetClick(item)"
      [class.cursor-pointer]="!isEditMode"
      class="h-full glass-nofilter rounded-xl transition-all duration-200 overflow-visible relative"
      [style.border]="isEditMode ? '2px solid var(--accent-primary)' : ''"
      [style.box-shadow]="isEditMode ? '0 0 0 2px var(--accent-primary), var(--shadow-card)' : ''"
    >
      <!-- Action Icons - Hidden in Edit Mode -->
      <div *ngIf="!isEditMode" class="absolute top-2 right-2 flex items-center gap-1">
        <!-- Edit with AI -->
        <button
          (click)="onEditWithAI(item.id, $event)"
          class="p-1.5 rounded-lg transition-colors border shadow-sm hover-glass"
          style="background: var(--bg-card); border-color: var(--border-subtle)"
          title="Edit with AI"
        >
          <svg
            class="w-4 h-4"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            ></path>
            <circle cx="18" cy="6" r="2" fill="currentColor" style="color: var(--accent-primary)" />
          </svg>
        </button>

        <!-- Date Range -->
        <div class="relative">
          <button
            (click)="toggleChartDateMenu(item.id, $event)"
            class="p-1.5 rounded-lg transition-colors border shadow-sm cursor-pointer"
            style="background: var(--bg-card); border-color: var(--border-subtle)"
            title="Change date range"
          >
            <svg
              class="w-4 h-4"
              style="color: var(--text-muted)"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              ></path>
            </svg>
          </button>

          <!-- Date Range Dropdown -->
          <div
            *ngIf="activeChartDateMenu === item.id"
            class="fixed z-[20] animate-fadeIn"
            [style.top.px]="datePickerPosition.top"
            [style.left.px]="datePickerPosition.left"
            (click)="$event.stopPropagation()"
          >
            <app-date-range-picker (dateRangeChange)="onChartDateRangeSelected(item.id, $event)">
            </app-date-range-picker>
          </div>
        </div>

        <!-- AI Badge for Chart Type -->
        <span
          *ngIf="item.type === 'chart'"
          class="px-2 py-1 text-xs font-medium rounded"
          style="background: var(--accent-gradient); color: var(--text-on-accent)"
        >
          AI
        </span>
      </div>

      <!-- Card Content with Responsive Padding -->
      <div class="p-3 sm:p-4 md:p-6 h-full overflow-auto">
        <!-- Summary Card -->
        <div *ngIf="item.type === 'summary'" class="h-full flex flex-col">
          <div class="flex items-center gap-2 mb-3 sm:mb-4" [class.pr-20]="!isEditMode">
            <span class="text-xl sm:text-2xl flex-shrink-0">✨</span>
            <h3
              class="text-base sm:text-lg font-semibold truncate flex-1"
              style="color: var(--text-primary)"
            >
              {{ item.title }}
            </h3>
          </div>
          <div class="space-y-2 sm:space-y-3 flex-1 overflow-y-auto">
            <div>
              <h4
                class="font-semibold mb-1 text-xs sm:text-sm"
                style="color: var(--text-secondary)"
              >
                Executive Summary
              </h4>
              <p class="text-xs" style="color: var(--text-muted)">{{ item.content }}</p>
            </div>
          </div>
        </div>

        <!-- Count Card -->
        <div
          *ngIf="item.type === 'count'"
          class="h-full flex flex-col justify-center"
          [class.pr-20]="!isEditMode"
        >
          <h3
            class="text-xs sm:text-sm font-medium mb-1 sm:mb-2 truncate"
            style="color: var(--text-secondary)"
          >
            {{ item.title }}
          </h3>
          <p
            class="text-2xl sm:text-3xl md:text-4xl font-bold mb-1"
            style="color: var(--accent-primary)"
          >
            {{ item.value }}
          </p>
          <p class="text-xs sm:text-sm" style="color: var(--text-muted)">{{ item.label }}</p>
        </div>

        <!-- Chart Card -->
        <div *ngIf="item.type === 'chart'" class="h-full flex flex-col">
          <div class="flex items-center gap-2 mb-2 sm:mb-3" [class.pr-24]="!isEditMode">
            <span class="text-base sm:text-xl flex-shrink-0">🤖</span>
            <h3
              class="text-sm sm:text-base font-semibold truncate flex-1"
              style="color: var(--text-primary)"
            >
              {{ item.title }}
            </h3>
          </div>
          <div
            class="rounded-lg p-2 sm:p-3 border flex-1 overflow-hidden flex flex-col min-h-[60px]"
            style="background: var(--bg-overlay); border-color: var(--border-subtle)"
          >
            <p
              class="text-[10px] sm:text-xs italic mb-2 line-clamp-2"
              style="color: var(--text-muted)"
            >
              "{{ item.prompt }}"
            </p>
            <div
              class="flex-1 flex items-center justify-center text-xs sm:text-sm"
              style="color: var(--text-muted)"
            >
              Chart visualization
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Drag Placeholder - Correct sizing -->
    <div
      *cdkDragPlaceholder
      class="bg-blue-100 border-2 border-dashed border-blue-400 rounded-lg opacity-50"
    ></div>
  </div>
</div>
