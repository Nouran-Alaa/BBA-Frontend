<div
  class="fixed inset-0 z-[60] flex items-center justify-center p-4"
  style="background-color: rgba(0, 0, 0, 0.3)"
  (click)="onClose()"
>
  <div
    class="rounded-xl shadow-2xl max-w-md w-full animate-slideUp overflow-hidden"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div
      class="px-6 py-4 text-white rounded-t-xl flex-shrink-0"
      style="background: var(--accent-gradient)"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
              ></path>
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold">Share Dashboard</h2>
            <p class="text-sm opacity-90">{{ dashboardName }}</p>
          </div>
        </div>
        <button
          (click)="onClose()"
          class="w-8 h-8 rounded-lg hover:bg-white/20 transition-colors flex items-center justify-center cursor-pointer"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4">
      <!-- Share Options Tabs -->
      <div class="flex gap-2 pb-0.5" style="border-bottom: 1px solid var(--border-subtle)">
        <button
          (click)="showUserShare = false"
          class="flex-1 pb-2 border-b-2 font-medium text-sm transition-colors cursor-pointer"
          [style.border-color]="!showUserShare ? 'var(--accent-primary)' : 'transparent'"
          [style.color]="!showUserShare ? 'var(--accent-primary)' : 'var(--text-muted)'"
        >
          Share Link
        </button>
        <button
          (click)="showUserShare = true"
          class="flex-1 pb-2 border-b-2 font-medium text-sm transition-colors cursor-pointer"
          [style.border-color]="showUserShare ? 'var(--accent-primary)' : 'transparent'"
          [style.color]="showUserShare ? 'var(--accent-primary)' : 'var(--text-muted)'"
        >
          Share with User
        </button>
      </div>

      <!-- Share Link Section -->
      <div *ngIf="!showUserShare" class="space-y-4">
        <p class="text-sm" style="color: var(--text-secondary)">
          Anyone with this link can view this dashboard. Copy and share the link below:
        </p>

        <!-- Share URL -->
        <div class="flex items-center gap-2">
          <input
            type="text"
            [value]="shareUrl"
            readonly
            class="flex-1 px-4 py-2 rounded-lg text-sm font-mono"
            style="
              background: var(--bg-input);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          />
          <button
            (click)="copyToClipboard()"
            class="px-4 py-2 text-white rounded-lg font-medium text-sm flex items-center gap-2 cursor-pointer transition-opacity hover:opacity-90"
            [style.background]="copied ? '#4caf50' : 'var(--accent-gradient)'"
          >
            <svg
              *ngIf="!copied"
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
              ></path>
            </svg>
            <svg
              *ngIf="copied"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
            {{ copied ? 'Copied!' : 'Copy' }}
          </button>
        </div>

        <!-- Info Message -->
        <div
          class="flex items-start gap-3 p-3 rounded-lg"
          style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
        >
          <svg
            class="w-5 h-5 flex-shrink-0 mt-0.5"
            style="color: var(--accent-primary)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          <p class="text-sm" style="color: var(--text-secondary)">
            View-only access. Recipients cannot edit.
          </p>
        </div>
      </div>

      <!-- Share with User Section -->
      <div *ngIf="showUserShare" class="space-y-4">
        <p class="text-sm" style="color: var(--text-secondary)">
          Invite someone to collaborate on this dashboard:
        </p>

        <!-- Email Input -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary)"
            >Email Address</label
          >
          <input
            type="email"
            [(ngModel)]="userEmail"
            placeholder="colleague@company.com"
            class="w-full px-4 py-2 rounded-lg text-sm"
            style="
              background: var(--bg-input);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          />
        </div>

        <!-- Permission Level -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary)"
            >Permission Level</label
          >
          <div class="space-y-2">
            <label
              *ngFor="
                let perm of [
                  { value: 'view', label: 'Can View', desc: 'View dashboard and widgets' },
                  { value: 'edit', label: 'Can Edit', desc: 'View and modify dashboard' },
                ]
              "
              class="flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-colors"
              [style.border]="
                '1px solid ' +
                (selectedPermission === perm.value
                  ? 'var(--accent-primary)'
                  : 'var(--border-subtle)')
              "
            >
              <input
                type="radio"
                [(ngModel)]="selectedPermission"
                [value]="perm.value"
                class="w-4 h-4"
              />
              <div class="flex-1 transition-opacity hover:opacity-90">
                <p class="font-medium text-sm" style="color: var(--text-primary)">
                  {{ perm.label }}
                </p>
                <p class="text-xs" style="color: var(--text-muted)">{{ perm.desc }}</p>
              </div>
            </label>
          </div>
        </div>

        <!-- Share Button -->
        <button
          (click)="onShareWithUser()"
          [disabled]="!userEmail.trim()"
          class="w-full px-4 py-2 text-white rounded-lg font-medium cursor-pointer disabled:opacity-50 transition-opacity hover:opacity-90"
          style="background: var(--accent-gradient)"
        >
          Send Invitation
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div
      class="px-6 py-4 flex justify-end rounded-b-xl"
      style="border-top: 1px solid var(--border-subtle)"
    >
      <button
        (click)="onClose()"
        class="px-6 py-2 rounded-lg font-medium cursor-pointer hover-glass transition-colors"
        style="
          background: var(--bg-overlay);
          color: var(--text-secondary);
          border: 1px solid var(--border-subtle);
        "
      >
        Close
      </button>
    </div>
  </div>
</div>
