<ng-container *ngIf="resolved">
  <!-- Widget wrapper -->
  <div class="nw-wrapper h-full flex flex-col">
    <!-- Header -->
    <div class="nw-header">
      <div class="nw-header-icon">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
          />
        </svg>
      </div>
      <h2 class="nw-header-title">{{ resolved.widgetTitle }}</h2>
      <span class="nw-count-pill">{{ resolved.articles.length }}</span>
    </div>

    <!-- Scrollable grid area -->
    <div class="nw-scroll flex-1">
      <div class="nw-grid">
        <!-- Each article card -->
        <article
          *ngFor="let article of visibleArticles; let i = index"
          class="nw-card"
          [style.animation-delay]="i * 50 + 'ms'"
          (click)="openArticle(article)"
          title="Click to read full article"
        >
          <!-- Photo -->
          <div class="nw-photo">
            <img
              *ngIf="article.imageUrl"
              [src]="article.imageUrl"
              [alt]="article.title"
              class="nw-photo-img"
              loading="lazy"
            />
            <div *ngIf="!article.imageUrl" class="nw-photo-placeholder">
              <svg class="w-7 h-7 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                />
              </svg>
            </div>

            <!-- Sentiment dot -->
            <span
              class="nw-sentiment-dot"
              [style.background]="getSentimentColor(article.sentiment)"
            ></span>

            <!-- Category pill -->
            <span *ngIf="article.category" class="nw-category">{{ article.category }}</span>
          </div>

          <!-- Body: title + source link -->
          <div class="nw-body">
            <p class="nw-title" dir="auto">{{ article.title }}</p>

            <!-- Source favicon — clicking opens the original article URL -->
            <div class="nw-source-row">
              <a
                [href]="article.sourceUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="nw-source-link"
                [title]="article.sourceName"
                (click)="onSourceClick($event)"
              >
                <img
                  *ngIf="article.sourceFaviconUrl"
                  [src]="article.sourceFaviconUrl"
                  [alt]="article.sourceName"
                  class="nw-favicon"
                  onerror="this.style.display = 'none'"
                />
                <span class="nw-source-name">{{ article.sourceName }}</span>
              </a>
              <span class="nw-time">{{ getTimeAgo(article.publishedAt) }}</span>
            </div>
          </div>
        </article>
      </div>
      <!-- /grid -->

      <!-- Load more -->
      <div *ngIf="hasMore" class="nw-load-more">
        <button class="nw-load-btn" (click)="loadMore()">Load more</button>
      </div>
    </div>
    <!-- /scroll -->
  </div>

  <!-- Fullscreen modal -->
  <app-news-fullscreen-modal
    *ngIf="selectedArticle"
    [article]="selectedArticle"
    (close)="closeModal()"
  />
</ng-container>
