<ng-container *ngIf="resolved">
  <div class="h-full flex flex-col p-3 sm:p-4 md:p-6">
    <!-- Header - Matching chart card style -->
    <div class="flex items-center gap-2 mb-3 sm:mb-4">
      <div
        class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg flex items-center justify-center flex-shrink-0"
        style="background: var(--accent-gradient)"
      >
        <svg
          class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"
          />
        </svg>
      </div>
      <h3
        class="text-sm sm:text-base font-semibold flex-1 min-w-0 truncate"
        style="color: var(--text-primary)"
      >
        {{ resolved.widgetTitle }}
      </h3>
      <span
        class="text-xs font-bold px-2.5 py-1 rounded-full flex-shrink-0"
        style="
          background: var(--bg-overlay);
          color: var(--text-muted);
          border: 1px solid var(--border-subtle);
        "
      >
        {{ resolved.articles.length }}
      </span>
    </div>

    <!-- Scrollable grid area with responsive columns -->
    <div class="flex-1 overflow-y-auto custom-scrollbar">
      <!-- Responsive grid: 1 col default, 2 at md, 3 at lg, 4 at xl -->
      <div
        class="grid gap-2.5 sm:gap-3"
        style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))"
      >
        <!-- Article card -->
        <article
          *ngFor="let article of visibleArticles; let i = index"
          class="flex flex-col rounded-xl overflow-hidden cursor-pointer transition-all duration-200 article-card"
          style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
          [style.animation-delay]="i * 50 + 'ms'"
          (click)="openArticle(article)"
        >
          <!-- Image -->
          <div
            class="relative aspect-video overflow-hidden flex-shrink-0"
            style="background: var(--bg-card)"
          >
            <img
              *ngIf="article.imageUrl"
              [src]="article.imageUrl"
              [alt]="article.title"
              class="w-full h-full object-cover article-img"
              loading="lazy"
            />

            <div
              *ngIf="!article.imageUrl"
              class="w-full h-full flex items-center justify-center"
              style="background: var(--bg-overlay)"
            >
              <svg
                class="w-8 h-8 opacity-20"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                />
              </svg>
            </div>

            <!-- Sentiment dot -->
            <span
              class="absolute top-2 left-2 w-2 h-2 rounded-full border-2"
              [style.background]="getSentimentColor(article.sentiment)"
              style="border-color: rgba(255, 255, 255, 0.6); box-shadow: 0 0 4px rgba(0, 0, 0, 0.5)"
            ></span>

            <!-- Category -->
            <span
              *ngIf="article.category"
              class="absolute bottom-2 left-2 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full"
              style="
                background: rgba(0, 0, 0, 0.58);
                color: rgba(255, 255, 255, 0.88);
                backdrop-filter: blur(4px);
              "
            >
              {{ article.category }}
            </span>
          </div>

          <!-- Body -->
          <div class="flex flex-col gap-2 p-2.5 flex-1">
            <!-- Title - Bigger font -->
            <p
              class="text-xs sm:text-sm font-bold line-clamp-3 leading-snug"
              style="color: var(--text-primary)"
            >
              {{ article.title }}
            </p>

            <!-- Source row -->
            <div class="flex items-center justify-between gap-2 mt-auto">
              <a
                [href]="article.sourceUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center gap-1.5 min-w-0 transition-opacity hover:opacity-75"
                [title]="article.sourceName"
                (click)="onSourceClick($event)"
              >
                <img
                  *ngIf="article.sourceFaviconUrl"
                  [src]="article.sourceFaviconUrl"
                  [alt]="article.sourceName"
                  class="w-3.5 h-3.5 rounded flex-shrink-0"
                  onerror="this.style.display = 'none'"
                />
                <span
                  class="text-[10px] sm:text-xs font-semibold truncate max-w-[90px]"
                  style="color: var(--accent-primary)"
                >
                  {{ article.sourceName }}
                </span>
              </a>
              <span class="text-[10px] sm:text-xs flex-shrink-0" style="color: var(--text-muted)">
                {{ getTimeAgo(article.publishedAt) }}
              </span>
            </div>
          </div>
        </article>
      </div>

      <!-- Load more -->
      <div *ngIf="hasMore" class="flex justify-center pt-4 pb-2">
        <button
          (click)="loadMore()"
          class="text-xs sm:text-sm font-bold tracking-wide px-5 py-2 rounded-full text-white transition-all cursor-pointer hover-scale"
          style="background: var(--accent-gradient); box-shadow: 0 3px 12px rgba(0, 150, 200, 0.25)"
        >
          Load more
        </button>
      </div>
    </div>
  </div>

  <!-- Modal is rendered at document.body via ModalPortalService — not here -->
</ng-container>
