<!-- Guard: render nothing until config is resolved -->
<ng-container *ngIf="resolved">
  <div class="vw-card" (click)="openModal()">
    <!-- ── Thumbnail ─────────────────────────────── -->
    <div class="vw-thumb">
      <!-- Poster image -->
      <img
        *ngIf="resolved.thumbnailUrl"
        [src]="resolved.thumbnailUrl"
        [alt]="resolved.title"
        class="vw-thumb-img"
      />
      <div *ngIf="!resolved.thumbnailUrl" class="vw-thumb-fallback">
        <svg class="w-10 h-10 opacity-20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>

      <!-- Dark gradient from bottom -->
      <div class="vw-thumb-grad"></div>

      <!-- Play button centred -->
      <div class="vw-play-ring">
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>

      <!-- Duration pill bottom-right -->
      <span class="vw-duration">{{ resolved.duration }}</span>

      <!-- Sentiment dot top-left -->
      <span
        *ngIf="resolved.sentiment"
        class="vw-sentiment-dot"
        [style.background]="getSentimentColor(resolved.sentiment)"
        [title]="resolved.sentiment"
      ></span>
    </div>
    <!-- /thumb -->

    <!-- ── Meta strip ─────────────────────────────── -->
    <div class="vw-meta">
      <!-- Channel avatar -->
      <img
        *ngIf="resolved.channelAvatarUrl"
        [src]="resolved.channelAvatarUrl"
        [alt]="resolved.channelName"
        class="vw-avatar"
        onerror="this.style.display = 'none'"
      />
      <div *ngIf="!resolved.channelAvatarUrl" class="vw-avatar-placeholder">
        <svg class="w-4 h-4 opacity-50" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"
          />
        </svg>
      </div>

      <!-- Title + channel name + time -->
      <div class="vw-text">
        <p class="vw-title" dir="auto">{{ resolved.title }}</p>
        <p class="vw-sub">{{ resolved.channelName }} · {{ getTimeAgo(resolved.publishedAt) }}</p>
      </div>
    </div>
    <!-- /meta -->
  </div>

  <!-- Fullscreen modal -->
  <app-video-fullscreen-modal *ngIf="isModalOpen" [config]="resolved" (close)="closeModal()" />
</ng-container>
