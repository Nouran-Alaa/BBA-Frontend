<div class="fixed top-4 right-4 z-[100] flex flex-col gap-3 pointer-events-none max-w-sm">
  <div
    *ngFor="let toast of toasts$ | async"
    class="pointer-events-auto"
    [class.animate-slideIn]="!toast.removing"
    [class.animate-slideOut]="toast.removing"
  >
    <div
      class="glass-heavy rounded-xl shadow-2xl overflow-hidden min-w-[300px] backdrop-blur-xl"
      [style.border-left]="'4px solid ' + getColor(toast.type)"
    >
      <div class="p-4 flex items-start gap-3">
        <!-- Icon -->
        <div
          class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center"
          [style.background]="getIconBackground(toast.type)"
        >
          <!-- Success Icon -->
          <svg
            *ngIf="toast.type === 'success'"
            class="w-4 h-4"
            [style.color]="getColor(toast.type)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
          <!-- Error Icon -->
          <svg
            *ngIf="toast.type === 'error'"
            class="w-4 h-4"
            [style.color]="getColor(toast.type)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
          <!-- Info Icon -->
          <svg
            *ngIf="toast.type === 'info'"
            class="w-4 h-4"
            [style.color]="getColor(toast.type)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          <!-- Warning Icon -->
          <svg
            *ngIf="toast.type === 'warning'"
            class="w-4 h-4"
            [style.color]="getColor(toast.type)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            ></path>
          </svg>
        </div>

        <!-- Message -->
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium leading-relaxed" style="color: var(--text-primary)">
            {{ toast.message }}
          </p>
        </div>

        <!-- Close Button -->
        <button
          (click)="removeToast(toast.id)"
          class="flex-shrink-0 w-6 h-6 rounded-lg flex items-center justify-center transition-colors cursor-pointer"
          style="color: var(--text-muted)"
          onmouseover="
            this.style.background = 'var(--bg-overlay)';
            this.style.color = 'var(--text-primary)';
          "
          onmouseout="
            this.style.background = 'transparent';
            this.style.color = 'var(--text-muted)';
          "
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Progress Bar -->
      <div
        *ngIf="toast.duration && toast.duration > 0 && !toast.removing"
        class="h-1 relative overflow-hidden"
      >
        <div
          class="absolute inset-0"
          [style.background]="getColor(toast.type)"
          style="opacity: 0.3"
        ></div>
        <div
          class="h-full animate-progress"
          [style.background]="getColor(toast.type)"
          [style.animation-duration]="toast.duration + 'ms'"
        ></div>
      </div>
    </div>
  </div>
</div>
