<div class="fixed bottom-4 right-4 z-[9999] flex flex-col" [class.minimized]="isMinimized">
  <!-- Chat Window -->
  <div
    *ngIf="!isMinimized"
    class="glass-heavy rounded-2xl shadow-2xl overflow-hidden flex flex-col chat-window-enter"
    style="width: 400px; height: 600px; border: 1px solid var(--border-glass)"
  >
    <!-- Header with animated buttons -->
    <div
      class="px-4 py-3 flex items-center justify-between flex-shrink-0"
      style="background: var(--accent-gradient); color: var(--text-on-accent)"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-full flex items-center justify-center"
          style="background: rgba(255, 255, 255, 0.2)"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
            ></path>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-sm">Dashboard Assistant</h3>

          <!-- Context Dropdown Button -->
          <button
            (click)="toggleContextDropdown()"
            class="flex items-center gap-1 text-xs opacity-90 hover:opacity-100 transition-opacity cursor-pointer"
            (click)="$event.stopPropagation()"
          >
            <span class="truncate max-w-[150px]">{{ getContextLabel() }}</span>
            <svg
              class="w-3 h-3 flex-shrink-0 transition-transform"
              [class.rotate-180]="showContextDropdown"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          <!-- Context Dropdown Menu -->
          <div
            *ngIf="showContextDropdown"
            class="absolute top-full left-0 mt-2 w-64 rounded-xl shadow-2xl overflow-hidden z-50 animate-slideIn"
            style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
            (click)="$event.stopPropagation()"
          >
            <!-- General Chat -->
            <button
              (click)="selectContext('none')"
              class="w-full px-4 py-3 flex items-center gap-3 transition-colors text-left hover-glass"
              [style.background]="contextMode === 'none' ? 'var(--bg-overlay)' : 'transparent'"
              [style.color]="'var(--text-primary)'"
            >
              <svg
                class="w-5 h-5 flex-shrink-0"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
                ></path>
              </svg>
              <div class="flex-1 min-w-0">
                <p class="font-medium text-sm">General Chat</p>
                <p class="text-xs opacity-70">No dashboard context</p>
              </div>
              <svg
                *ngIf="contextMode === 'none'"
                class="w-5 h-5"
                style="color: var(--accent-primary)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
            </button>

            <!-- Current Dashboard -->
            <button
              (click)="selectContext('current')"
              class="w-full px-4 py-3 flex items-center gap-3 transition-colors text-left hover-glass"
              [style.background]="contextMode === 'current' ? 'var(--bg-overlay)' : 'transparent'"
              [style.color]="'var(--text-primary)'"
            >
              <svg
                class="w-5 h-5 flex-shrink-0"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                ></path>
              </svg>
              <div class="flex-1 min-w-0">
                <p class="font-medium text-sm">Current Dashboard</p>
                <p class="text-xs opacity-70">Active dashboard only</p>
              </div>
              <svg
                *ngIf="contextMode === 'current'"
                class="w-5 h-5"
                style="color: var(--accent-primary)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
            </button>

            <!-- All Dashboards -->
            <button
              (click)="selectContext('all')"
              class="w-full px-4 py-3 flex items-center gap-3 transition-colors text-left hover-glass"
              [style.background]="contextMode === 'all' ? 'var(--bg-overlay)' : 'transparent'"
              [style.color]="'var(--text-primary)'"
            >
              <svg
                class="w-5 h-5 flex-shrink-0"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"
                ></path>
              </svg>
              <div class="flex-1 min-w-0">
                <p class="font-medium text-sm">All Dashboards</p>
                <p class="text-xs opacity-70">Access all data</p>
              </div>
              <svg
                *ngIf="contextMode === 'all'"
                class="w-5 h-5"
                style="color: var(--accent-primary)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
            </button>

            <!-- Divider -->
            <div
              *ngIf="availableDashboards.length > 0"
              class="h-px"
              style="background: var(--border-subtle)"
            ></div>

            <!-- Specific Dashboards -->
            <div *ngIf="availableDashboards.length > 0" class="max-h-48 overflow-y-auto">
              <button
                *ngFor="let dashboard of availableDashboards"
                (click)="selectContext('specific', dashboard.id)"
                class="w-full px-4 py-2.5 flex items-center gap-3 transition-colors text-left hover-glass"
                [style.background]="
                  contextMode === 'specific' && selectedDashboardId === dashboard.id
                    ? 'var(--bg-overlay)'
                    : 'transparent'
                "
                [style.color]="'var(--text-primary)'"
              >
                <svg
                  class="w-4 h-4 flex-shrink-0"
                  style="color: var(--text-muted)"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                  ></path>
                </svg>
                <span class="flex-1 text-sm truncate">{{ dashboard.name }}</span>
                <svg
                  *ngIf="contextMode === 'specific' && selectedDashboardId === dashboard.id"
                  class="w-4 h-4"
                  style="color: var(--accent-primary)"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                  ></path>
                </svg>
              </button>
            </div>

            <div
              *ngIf="availableDashboards.length === 0"
              class="px-4 py-3 text-center text-xs"
              style="color: var(--text-muted)"
            >
              No other dashboards available
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Clear Chat with hover -->
        <button
          (click)="clearChat()"
          class="p-1.5 rounded-lg transition-all cursor-pointer header-button"
          style="background: rgba(255, 255, 255, 0.15)"
          title="Clear chat"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            ></path>
          </svg>
        </button>

        <!-- Minimize with hover -->
        <button
          (click)="toggleMinimize()"
          class="p-1.5 rounded-lg transition-all cursor-pointer header-button"
          style="background: rgba(255, 255, 255, 0.15)"
          title="Minimize"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20 12H4"
            ></path>
          </svg>
        </button>

        <!-- Close with hover -->
        <button
          (click)="onClose()"
          class="p-1.5 rounded-lg transition-all cursor-pointer header-button"
          style="background: rgba(255, 255, 255, 0.15)"
          title="Close"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div
      #messageContainer
      class="flex-1 overflow-y-auto p-4 space-y-4"
      style="background: var(--bg-secondary)"
    >
      <div
        *ngFor="let message of messages$ | async"
        class="flex"
        [class.justify-end]="message.role === 'user'"
        [class.message-user]="message.role === 'user'"
        [class.message-assistant]="message.role === 'assistant'"
      >
        <div class="max-w-[80%]">
          <!-- Message Bubble -->
          <div
            class="rounded-2xl px-4 py-2.5 shadow-sm"
            [style.background]="
              message.role === 'user' ? 'var(--accent-gradient)' : 'var(--bg-card)'
            "
            [style.color]="
              message.role === 'user' ? 'var(--text-on-accent)' : 'var(--text-primary)'
            "
          >
            <p class="text-sm whitespace-pre-line leading-relaxed">{{ message.content }}</p>
          </div>

          <!-- Template Action Button with glow -->
          <button
            *ngIf="message.templateId && message.role === 'assistant'"
            (click)="createDashboardFromTemplate(message.templateId)"
            class="mt-2 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer text-white template-button"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
          >
            ✨ Create This Dashboard
          </button>

          <!-- Suggestions with staggered animation -->
          <div
            *ngIf="message.suggestions && message.suggestions.length > 0"
            class="mt-2 flex flex-wrap gap-2"
          >
            <button
              *ngFor="let suggestion of message.suggestions; let i = index"
              (click)="useSuggestion(suggestion)"
              class="px-3 py-1.5 text-xs rounded-lg cursor-pointer transition-all suggestion-chip suggestion-button"
              [style.animation-delay]="i * 50 + 'ms'"
              style="
                background: var(--bg-overlay);
                color: var(--text-primary);
                border: 1px solid var(--border-subtle);
              "
              onmouseover="
                this.style.background = 'var(--accent-gradient)';
                this.style.color = 'var(--text-on-accent)';
                this.style.borderColor = 'transparent';
              "
              onmouseout="
                this.style.background = 'var(--bg-overlay)';
                this.style.color = 'var(--text-primary)';
                this.style.borderColor = 'var(--border-subtle)';
              "
            >
              {{ suggestion }}
            </button>
          </div>

          <!-- Timestamp with fade in -->
          <p
            class="text-xs mt-1 opacity-60 message-timestamp"
            [class.text-right]="message.role === 'user'"
            style="color: var(--text-muted)"
          >
            {{ message.timestamp | date: 'shortTime' }}
          </p>
        </div>
      </div>

      <!-- Typing Indicator with enhanced animation -->
      <div *ngIf="isTyping" class="flex items-center gap-2 message-assistant">
        <div class="px-4 py-3 rounded-2xl" style="background: var(--bg-card)">
          <div class="flex gap-1.5">
            <div
              class="w-2 h-2 rounded-full animate-bounce"
              style="background: var(--text-muted); animation-delay: 0ms"
            ></div>
            <div
              class="w-2 h-2 rounded-full animate-bounce"
              style="background: var(--text-muted); animation-delay: 200ms"
            ></div>
            <div
              class="w-2 h-2 rounded-full animate-bounce"
              style="background: var(--text-muted); animation-delay: 400ms"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input with enhanced button -->
    <div
      class="p-4 flex-shrink-0"
      style="background: var(--bg-card); border-top: 1px solid var(--border-subtle)"
    >
      <div class="flex gap-2 items-end">
        <textarea
          [(ngModel)]="userInput"
          (keydown)="handleKeyPress($event)"
          placeholder="Ask me anything..."
          rows="1"
          class="flex-1 px-4 py-2.5 rounded-xl resize-none text-sm focus:outline-none transition-all"
          style="
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            max-height: 100px;
          "
        ></textarea>

        <button
          (click)="sendMessage()"
          [disabled]="!userInput.trim()"
          class="px-4 py-2.5 rounded-xl cursor-pointer text-white flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed send-button"
          style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Minimized Floating Button with animation -->
  <button
    *ngIf="isMinimized"
    (click)="toggleMinimize()"
    class="w-14 h-14 rounded-full flex items-center justify-center shadow-2xl cursor-pointer floating-button"
    style="background: var(--accent-gradient); color: var(--text-on-accent)"
  >
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      ></path>
    </svg>
  </button>
</div>
