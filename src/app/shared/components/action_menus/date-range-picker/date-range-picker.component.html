<div
  class="rounded-xl shadow-2xl border overflow-hidden"
  style="background: var(--bg-modal); border-color: var(--border-glass); min-width: 280px"
>
  <!-- Quick Select Buttons -->
  <div class="grid grid-cols-2 gap-2 p-4" style="border-bottom: 1px solid var(--border-subtle)">
    <button
      *ngFor="let preset of presetRanges"
      (click)="selectPreset(preset.value)"
      class="px-3 py-2 text-sm font-medium rounded-lg transition-all cursor-pointer"
      [style.background]="
        selectedPreset === preset.label ? 'var(--accent-gradient)' : 'var(--bg-overlay)'
      "
      [style.color]="
        selectedPreset === preset.label ? 'var(--text-on-accent)' : 'var(--text-primary)'
      "
      [style.border]="
        '1px solid ' + (selectedPreset === preset.label ? 'transparent' : 'var(--border-subtle)')
      "
    >
      {{ preset.label }}
    </button>
  </div>

  <!-- Date Inputs -->
  <div class="p-4 space-y-3">
    <div>
      <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary)"
        >Start Date</label
      >
      <input
        type="date"
        [(ngModel)]="startDate"
        (change)="onCustomDateChange()"
        class="w-full px-3 py-2 rounded-lg text-sm"
        style="
          background: var(--bg-input);
          border: 1px solid var(--border-subtle);
          color: var(--text-primary);
        "
      />
    </div>
    <div>
      <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary)"
        >End Date</label
      >
      <input
        type="date"
        [(ngModel)]="endDate"
        (change)="onCustomDateChange()"
        class="w-full px-3 py-2 rounded-lg text-sm"
        style="
          background: var(--bg-input);
          border: 1px solid var(--border-subtle);
          color: var(--text-primary);
        "
      />
    </div>
  </div>

  <!-- Apply Button -->
  <div class="p-4" style="border-top: 1px solid var(--border-subtle)">
    <button
      (click)="applyRange()"
      class="w-full px-4 py-2 rounded-lg font-medium text-sm cursor-pointer text-white"
      style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
    >
      Apply Range
    </button>
  </div>
</div>
