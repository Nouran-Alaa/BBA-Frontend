<!-- date-range-picker.component.html — space theme -->
<div class="drp-panel rounded-xl shadow-2xl overflow-hidden" style="min-width: 272px">
  <!-- Quick preset buttons -->
  <div class="grid grid-cols-2 gap-2 p-3" style="border-bottom: 1px solid var(--border-subtle)">
    <button
      *ngFor="let preset of presetRanges"
      (click)="selectPreset(preset.value)"
      class="px-3 py-1.5 text-xs font-semibold rounded-lg cursor-pointer transition-all duration-150 hover:-translate-y-px"
      [style.background]="
        selectedPreset === preset.label ? 'var(--accent-gradient)' : 'var(--bg-overlay)'
      "
      [style.color]="selectedPreset === preset.label ? '#fff' : 'var(--text-primary)'"
      [style.border]="
        '1px solid ' + (selectedPreset === preset.label ? 'transparent' : 'var(--border-subtle)')
      "
    >
      {{ preset.label }}
    </button>
  </div>

  <!-- Date inputs -->
  <div class="p-3 space-y-2.5">
    <div>
      <label
        class="block text-[10px] font-bold mb-1 uppercase tracking-wide"
        style="color: var(--text-muted)"
        >Start Date</label
      >
      <input
        type="date"
        [(ngModel)]="startDate"
        (change)="onCustomDateChange()"
        class="w-full px-3 py-1.5 rounded-lg text-sm cursor-pointer outline-none"
        style="
          background: var(--bg-overlay);
          border: 1px solid var(--border-subtle);
          color: var(--text-primary);
        "
      />
    </div>
    <div>
      <label
        class="block text-[10px] font-bold mb-1 uppercase tracking-wide"
        style="color: var(--text-muted)"
        >End Date</label
      >
      <input
        type="date"
        [(ngModel)]="endDate"
        (change)="onCustomDateChange()"
        class="w-full px-3 py-1.5 rounded-lg text-sm cursor-pointer outline-none"
        style="
          background: var(--bg-overlay);
          border: 1px solid var(--border-subtle);
          color: var(--text-primary);
        "
      />
    </div>
  </div>

  <!-- Apply -->
  <div class="p-3" style="border-top: 1px solid var(--border-subtle)">
    <button
      (click)="applyRange()"
      class="w-full py-2 rounded-lg text-sm font-bold cursor-pointer text-white transition-all duration-150 hover:opacity-90"
      style="background: var(--accent-gradient)"
    >
      Apply Range
    </button>
  </div>
</div>
