<div class="h-full">
  <!-- Summary Card -->
  <div *ngIf="item.type === 'summary'" class="h-full flex flex-col p-3 sm:p-4 md:p-6">
    <div class="flex items-center gap-2 mb-3 sm:mb-4" [class.pr-20]="!isEditMode">
      <span class="text-xl sm:text-2xl flex-shrink-0">{{ getSummaryIcon() }}</span>
      <h3
        class="text-base sm:text-lg font-semibold truncate flex-1"
        style="color: var(--text-primary)"
      >
        {{ item.title }}
      </h3>
    </div>
    <div class="space-y-2 sm:space-y-3 flex-1 overflow-y-auto custom-scrollbar">
      <div>
        <h4 class="font-semibold mb-1 text-xs sm:text-sm" style="color: var(--text-secondary)">
          Executive Summary
        </h4>
        <p class="text-xs leading-relaxed" style="color: var(--text-muted)">{{ item.content }}</p>
      </div>
    </div>
  </div>

  <!-- Count Card -->
  <div
    *ngIf="item.type === 'count'"
    class="h-full flex flex-col justify-center p-3 sm:p-4 md:p-6"
    [class.pr-20]="!isEditMode"
  >
    <h3
      class="text-xs sm:text-sm font-medium mb-1 sm:mb-2 truncate"
      style="color: var(--text-secondary)"
    >
      {{ item.title }}
    </h3>
    <p class="text-2xl sm:text-3xl md:text-4xl font-bold mb-1" style="color: var(--accent-primary)">
      {{ item.value | number }}
    </p>
    <p class="text-xs sm:text-sm" style="color: var(--text-muted)">{{ item.label }}</p>
  </div>

  <!-- Chart Card -->
  <div *ngIf="item.type === 'chart'" class="h-full flex flex-col p-3 sm:p-4 md:p-6">
    <div class="flex items-center gap-2 mb-2 sm:mb-3" [class.pr-24]="!isEditMode">
      <span class="text-base sm:text-xl flex-shrink-0">{{ getChartIcon() }}</span>
      <h3
        class="text-sm sm:text-base font-semibold truncate flex-1"
        style="color: var(--text-primary)"
      >
        {{ item.title }}
      </h3>
    </div>
    <div
      class="rounded-lg p-2 sm:p-3 border flex-1 overflow-hidden flex flex-col min-h-[60px]"
      style="background: var(--bg-overlay); border-color: var(--border-subtle)"
    >
      <p class="text-[10px] sm:text-xs italic mb-2 line-clamp-2" style="color: var(--text-muted)">
        "{{ item.prompt }}"
      </p>
      <div
        class="flex-1 flex items-center justify-center text-xs sm:text-sm"
        style="color: var(--text-muted)"
      >
        Chart visualization
      </div>
    </div>
  </div>

  <!-- Widget Card (News or Video) -->

  <!-- News Widget -->
  <ng-container *ngIf="item.type === 'news'">
    <app-news-widget
      [config]="item.newsConfig"
      class="block w-full h-full"
      (click)="$event.stopPropagation()"
    ></app-news-widget>
  </ng-container>

  <!-- Video Widget -->
  <ng-container *ngIf="item.type === 'video'">
    <app-video-widget
      [config]="item.videoConfig"
      class="block w-full h-full"
      (click)="$event.stopPropagation()"
    ></app-video-widget>
  </ng-container>
</div>
