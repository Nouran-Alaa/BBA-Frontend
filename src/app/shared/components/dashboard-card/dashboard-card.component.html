<!-- dashboard-card.component.html  v5 -->
<div class="h-full">
  <!-- ══════════════════════════════════════════════════════════════════════
       COUNT-CARD — stat box: [logo] / title / description / number / change
       All fields except title + number are optional.
  ══════════════════════════════════════════════════════════════════════ -->
  <div *ngIf="item.type === 'count-card'" class="flex flex-col w-full h-full overflow-hidden">
    <!-- Header row — identical pattern to chart card: dot + title -->
    <div
      class="flex items-center gap-1.5 px-2.5 pt-2 pb-1 flex-shrink-0"
      [class.pr-20]="!isEditMode"
    >
      <span class="chart-dot w-2 h-2 rounded-full flex-shrink-0"></span>
      <h3
        class="text-[0.78rem] font-semibold truncate flex-1 m-0"
        style="color: var(--text-primary)"
      >
        {{ item.title }}
      </h3>
    </div>

    <!-- Body -->
    <div class="flex-1 flex flex-col justify-center px-3 pb-3 gap-2 min-h-0">
      <!-- Optional logo -->
      <div
        *ngIf="item.cardLogoUrl"
        class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
        style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
      >
        <img
          [src]="item.cardLogoUrl"
          [alt]="item.title"
          class="w-6 h-6 object-contain rounded-lg"
          onerror="this.parentElement.style.display = 'none'"
        />
      </div>

      <!-- Title (label for what the count is for) -->
      <p class="text-[0.72rem] font-semibold leading-snug" style="color: var(--text-secondary)">
        {{ item.cardSubtitle || item.title }}
      </p>

      <!-- Optional description -->
      <p
        *ngIf="item.cardDescription"
        class="text-[0.65rem] leading-relaxed -mt-1"
        style="color: var(--text-muted)"
      >
        {{ item.cardDescription }}
      </p>

      <!-- Big number -->
      <p
        class="font-extrabold leading-none tracking-tight"
        style="font-size: clamp(1.6rem, 4vw, 2.6rem); letter-spacing: -0.03em"
        [style.color]="item.cardAccentColor || 'var(--text-primary)'"
      >
        {{ formatCardValue(item.cardValue) }}
      </p>

      <!-- Optional change pill -->
      <div
        *ngIf="item.cardChange !== undefined && item.cardChange !== null"
        class="flex items-center gap-1 self-start px-2 py-0.5 rounded-full text-[0.68rem] font-bold"
        [style.color]="
          item.cardChange > 0 ? '#10b981' : item.cardChange < 0 ? '#ef4444' : 'var(--text-muted)'
        "
        [style.background]="
          item.cardChange > 0
            ? 'rgba(16,185,129,0.12)'
            : item.cardChange < 0
              ? 'rgba(239,68,68,0.12)'
              : 'var(--bg-overlay)'
        "
        [style.border]="
          '1px solid ' +
          (item.cardChange > 0
            ? 'rgba(16,185,129,0.25)'
            : item.cardChange < 0
              ? 'rgba(239,68,68,0.25)'
              : 'var(--border-subtle)')
        "
      >
        <svg
          *ngIf="item.cardChange > 0"
          class="w-2.5 h-2.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7 7 7" />
        </svg>
        <svg
          *ngIf="item.cardChange < 0"
          class="w-2.5 h-2.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="3"
            d="M19 14l-7 7-7-7"
          />
        </svg>
        <svg
          *ngIf="item.cardChange === 0"
          class="w-2.5 h-2.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 12h14" />
        </svg>
        <span
          >{{ item.cardChange > 0 ? '+' : '' }}{{ item.cardChange
          }}{{ item.cardChangeUnit || '%' }}</span
        >
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════════
       CHART CARD — unchanged from v4
  ══════════════════════════════════════════════════════════════════════ -->
  <div *ngIf="item.type === 'chart'" class="flex flex-col w-full h-full overflow-hidden">
    <div
      class="flex items-center gap-1.5 px-2.5 pt-2 pb-1 flex-shrink-0"
      [class.pr-20]="!isEditMode"
    >
      <span class="chart-dot w-2 h-2 rounded-full flex-shrink-0"></span>
      <h3
        class="text-[0.78rem] font-semibold truncate flex-1 m-0"
        style="color: var(--text-primary)"
      >
        {{ item.title }}
      </h3>
    </div>
    <div class="chart-canvas-wrapper flex-1 min-h-0 px-1 pb-1.5 relative">
      <div
        echarts
        [options]="chartOption"
        [initOpts]="initOpts"
        [autoResize]="true"
        class="chart-canvas block w-full h-full"
      ></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════════
       NEWS WIDGET — unchanged from v4
  ══════════════════════════════════════════════════════════════════════ -->
  <ng-container *ngIf="item.type === 'news'">
    <app-news-widget
      [config]="item.newsConfig"
      class="block w-full h-full"
      (click)="$event.stopPropagation()"
    ></app-news-widget>
  </ng-container>

  <!-- ══════════════════════════════════════════════════════════════════════
       VIDEO WIDGET — unchanged from v4
  ══════════════════════════════════════════════════════════════════════ -->
  <ng-container *ngIf="item.type === 'video'">
    <app-video-widget
      [config]="item.videoConfig"
      class="block w-full h-full"
      (click)="$event.stopPropagation()"
    ></app-video-widget>
  </ng-container>
</div>
