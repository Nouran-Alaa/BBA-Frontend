<!-- dashboard-card.component.html  v6 — NASA Space theme
     COUNT-CARD: Fully animated, holographic, space-tech aesthetic
     LOGIC: 100% unchanged.
-->
<div class="h-full">
  <!-- ══ COUNT-CARD — NASA Mission Control ════════════════════════ -->
  <div
    *ngIf="item.type === 'count-card'"
    class="count-card-outer flex flex-col w-full h-full overflow-hidden relative"
  >
    <!-- Animated scan-line sweep -->
    <div class="cc-scanline" aria-hidden="true"></div>

    <!-- Corner brackets (top-left, top-right, bottom-left, bottom-right) -->
    <div class="cc-corner cc-corner-tl" aria-hidden="true"></div>
    <div class="cc-corner cc-corner-tr" aria-hidden="true"></div>
    <div class="cc-corner cc-corner-bl" aria-hidden="true"></div>
    <div class="cc-corner cc-corner-br" aria-hidden="true"></div>

    <!-- Glow orb behind number -->
    <div
      class="cc-glow-orb"
      aria-hidden="true"
      [style.background]="
        'radial-gradient(circle, ' +
        (item.cardAccentColor || 'rgba(0,200,255,0.22)') +
        ' 0%, transparent 70%)'
      "
    ></div>

    <!-- Header row -->
    <div
      class="flex items-center gap-1.5 px-3 pt-2.5 pb-0 flex-shrink-0"
      [class.pr-20]="!isEditMode"
    >
      <span class="cc-dot flex-shrink-0" aria-hidden="true"></span>
      <span class="cc-status-text">LIVE</span>
      <h3
        class="text-[0.75rem] font-semibold truncate flex-1 m-0 ml-1"
        style="color: var(--text-secondary)"
      >
        {{ item.title }}
      </h3>
    </div>

    <!-- Body -->
    <div
      class="flex-1 flex flex-col justify-center items-center px-3 pb-2 gap-1.5 min-h-0 text-center"
    >
      <!-- Logo -->
      <div
        *ngIf="item.cardLogoUrl"
        class="cc-logo-wrap flex-shrink-0"
        [style.border-color]="item.cardAccentColor || 'rgba(0,200,255,0.3)'"
      >
        <img
          [src]="item.cardLogoUrl"
          [alt]="item.title"
          class="w-6 h-6 object-contain rounded-lg"
          onerror="this.parentElement.style.display = 'none'"
        />
      </div>

      <!-- Subtitle -->
      <p
        class="text-[0.70rem] font-semibold leading-snug tracking-wider uppercase"
        style="color: var(--text-muted); letter-spacing: 0.1em"
      >
        {{ item.cardSubtitle || item.title }}
      </p>

      <!-- Main number — huge, glowing -->
      <div class="cc-number-wrap relative flex items-center justify-center">
        <p
          class="cc-number font-extrabold leading-none relative z-[1]"
          style="
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            letter-spacing: -0.04em;
          "
          [style.color]="item.cardAccentColor || 'var(--accent-primary)'"
          [style.text-shadow]="
            '0 0 30px ' +
            (item.cardAccentColor || 'rgba(0,200,255,0.8)') +
            ', 0 0 60px ' +
            (item.cardAccentColor || 'rgba(0,200,255,0.4)')
          "
        >
          {{ formatCardValue(item.cardValue) }}
        </p>
      </div>

      <!-- Description -->
      <p
        *ngIf="item.cardDescription"
        class="text-[0.62rem] leading-relaxed -mt-0.5 max-w-[90%]"
        style="color: var(--text-muted)"
      >
        {{ item.cardDescription }}
      </p>

      <!-- Change pill — mission-control style -->
      <div
        *ngIf="item.cardChange !== undefined && item.cardChange !== null"
        class="cc-change-pill flex items-center gap-1"
        [class.cc-change-up]="item.cardChange > 0"
        [class.cc-change-down]="item.cardChange < 0"
        [class.cc-change-flat]="item.cardChange === 0"
      >
        <!-- Up arrow -->
        <svg
          *ngIf="item.cardChange > 0"
          class="w-2.5 h-2.5 flex-shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7 7 7" />
        </svg>
        <!-- Down arrow -->
        <svg
          *ngIf="item.cardChange < 0"
          class="w-2.5 h-2.5 flex-shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="3"
            d="M19 14l-7 7-7-7"
          />
        </svg>
        <!-- Flat -->
        <svg
          *ngIf="item.cardChange === 0"
          class="w-2.5 h-2.5 flex-shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 12h14" />
        </svg>
        <span class="text-[0.68rem] font-bold tracking-wider">
          {{ item.cardChange > 0 ? '+' : '' }}{{ item.cardChange }}{{ item.cardChangeUnit || '%' }}
        </span>
      </div>
    </div>

    <!-- Bottom bar — animated progress line -->
    <div class="cc-bottom-bar flex-shrink-0">
      <div
        class="cc-progress-line"
        [style.background]="item.cardAccentColor || 'var(--accent-primary)'"
      ></div>
    </div>
  </div>

  <!-- ══ CHART CARD ══════════════════════════════════════════════ -->
  <div *ngIf="item.type === 'chart'" class="flex flex-col w-full h-full overflow-hidden">
    <div
      class="flex items-center gap-1.5 px-2.5 pt-2 pb-1 flex-shrink-0"
      [class.pr-20]="!isEditMode"
    >
      <span class="chart-dot w-2 h-2 rounded-full flex-shrink-0"></span>
      <h3
        class="text-[0.78rem] font-semibold truncate flex-1 m-0"
        style="color: var(--text-primary)"
      >
        {{ item.title }}
      </h3>
    </div>
    <div class="chart-canvas-wrapper flex-1 min-h-0 px-1 pb-1.5 relative">
      <div
        echarts
        [options]="chartOption"
        [initOpts]="initOpts"
        [autoResize]="true"
        class="chart-canvas block w-full h-full"
      ></div>
    </div>
  </div>

  <!-- ══ NEWS WIDGET ═════════════════════════════════════════════ -->
  <ng-container *ngIf="item.type === 'news'">
    <app-news-widget
      [config]="item.newsConfig"
      class="block w-full h-full"
      (click)="$event.stopPropagation()"
    ></app-news-widget>
  </ng-container>

  <!-- ══ VIDEO WIDGET ════════════════════════════════════════════ -->
  <ng-container *ngIf="item.type === 'video'">
    <app-video-widget
      [config]="item.videoConfig"
      class="block w-full h-full"
      (click)="$event.stopPropagation()"
    ></app-video-widget>
  </ng-container>
</div>
