<!-- toast.component.html — Space theme, Tailwind-first -->
<div
  *ngFor="let toast of toasts$ | async"
  class="pointer-events-auto"
  [class.animate-slideIn]="!toast.removing"
  [class.animate-slideOut]="toast.removing"
>
  <div
    class="glass-heavy toast-inner rounded-xl shadow-2xl overflow-hidden min-w-[300px]"
    [style.border-left]="'4px solid ' + getColor(toast.type)"
  >
    <!-- Body row -->
    <div class="flex items-start gap-3 p-4">
      <!-- Icon badge -->
      <div
        class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center"
        [style.background]="getIconBackground(toast.type)"
      >
        <!-- Success -->
        <svg
          *ngIf="toast.type === 'success'"
          class="w-3.5 h-3.5"
          [style.color]="getColor(toast.type)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M5 13l4 4L19 7"
          />
        </svg>
        <!-- Error -->
        <svg
          *ngIf="toast.type === 'error'"
          class="w-3.5 h-3.5"
          [style.color]="getColor(toast.type)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
        <!-- Info -->
        <svg
          *ngIf="toast.type === 'info'"
          class="w-3.5 h-3.5"
          [style.color]="getColor(toast.type)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <!-- Warning -->
        <svg
          *ngIf="toast.type === 'warning'"
          class="w-3.5 h-3.5"
          [style.color]="getColor(toast.type)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
      </div>

      <!-- Message -->
      <p
        class="flex-1 min-w-0 text-sm font-medium leading-relaxed"
        style="color: var(--text-primary)"
      >
        {{ toast.message }}
      </p>

      <!-- Close -->
      <button
        (click)="removeToast(toast.id)"
        class="flex-shrink-0 w-6 h-6 rounded-lg flex items-center justify-center cursor-pointer transition-all duration-150 hover:bg-[var(--bg-overlay)]"
        style="color: var(--text-muted)"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Progress bar -->
    <div
      *ngIf="toast.duration && toast.duration > 0 && !toast.removing"
      class="h-[3px] relative overflow-hidden"
    >
      <div class="absolute inset-0 opacity-20" [style.background]="getColor(toast.type)"></div>
      <div
        class="h-full animate-progress rounded-full"
        [style.background]="getColor(toast.type)"
        [style.box-shadow]="'0 0 6px ' + getColor(toast.type)"
        [style.animation-duration]="toast.duration + 'ms'"
      ></div>
    </div>
  </div>
</div>
