<!-- top-nav.component.html -->
<div class="flex items-center h-14 px-4 gap-3 relative overflow-visible">
  <!-- Hamburger — hidden on desktop via CSS (.tn-hamburger) -->
  <button
    (click)="menuToggle.emit()"
    class="tn-hamburger w-[34px] h-[34px] rounded-[9px] border-none cursor-pointer flex items-center justify-center bg-transparent transition-all duration-[180ms] hover:scale-[1.08] active:scale-[.94] flex-shrink-0"
    style="color: var(--text-secondary)"
    aria-label="Toggle sidebar"
  >
    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2.5"
        d="M4 6h16M4 12h16M4 18h16"
      />
    </svg>
  </button>

  <!-- Brand -->
  <span
    class="hidden sm:inline text-base leading-none whitespace-nowrap flex-shrink-0"
    style="font-family: 'Exo 2', system-ui, sans-serif"
  >
    <span class="font-extrabold" style="color: var(--text-primary)">BigBrother</span
    ><span class="font-light opacity-90" style="color: #0099cc">Analytics</span>
  </span>

  <div class="flex-1 min-w-0"></div>

  <!-- Right actions -->
  <div class="flex items-center gap-1.5 flex-shrink-0">
    <!-- Theme toggle -->
    <button
      class="w-[34px] h-[34px] rounded-[9px] border-none cursor-pointer flex items-center justify-center bg-transparent transition-all duration-[180ms] hover:scale-[1.08] active:scale-[.94] hover:bg-[var(--bg-overlay)]"
      style="color: var(--text-secondary)"
      (click)="toggleTheme()"
      title="Toggle theme"
    >
      <svg
        *ngIf="isDark$ | async"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="12" r="5" stroke-width="2" />
        <path
          stroke-linecap="round"
          stroke-width="2"
          d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
        />
      </svg>
      <svg
        *ngIf="!(isDark$ | async)"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        />
      </svg>
    </button>

    <!-- Notifications -->
    <button
      class="relative w-[34px] h-[34px] rounded-[9px] border-none cursor-pointer flex items-center justify-center bg-transparent transition-all duration-[180ms] hover:scale-[1.08] active:scale-[.94] hover:bg-[var(--bg-overlay)]"
      style="color: var(--text-secondary)"
      title="Notifications"
    >
      <svg width="17" height="17" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
        />
      </svg>
      <span class="tn-notif-dot absolute top-2 right-2 w-1.5 h-1.5 rounded-full"></span>
    </button>

    <!-- User avatar + dropdown -->
    <div class="relative">
      <button
        class="tn-user-btn flex items-center gap-2 px-[10px] pl-[5px] py-[5px] rounded-[10px] cursor-pointer transition-all duration-200 flex-shrink-0 border border-[color:var(--border-glass)] bg-[var(--bg-overlay)]"
        (click)="toggleUserMenu()"
        aria-label="User menu"
        [attr.aria-expanded]="showUserMenu"
      >
        <span
          class="tn-avatar w-[30px] h-[30px] rounded-[8px] flex items-center justify-center font-extrabold text-[0.72rem] text-white flex-shrink-0"
          style="font-family: 'Exo 2', system-ui, sans-serif"
          >{{ userInitials }}</span
        >
        <span
          *ngIf="!isMobile"
          class="text-[0.78rem] font-semibold whitespace-nowrap"
          style="color: var(--text-primary); font-family: 'Exo 2', system-ui, sans-serif"
          >{{ userName }}</span
        >
        <svg
          *ngIf="!isMobile"
          width="11"
          height="11"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          class="flex-shrink-0 transition-transform duration-200"
          style="color: var(--text-muted)"
          [style.transform]="showUserMenu ? 'rotate(180deg)' : 'rotate(0deg)'"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <!-- Dropdown -->
      <div
        *ngIf="showUserMenu"
        class="tn-dropdown absolute right-0 min-w-[200px] rounded-[14px] overflow-hidden z-[1000]"
        style="top: calc(100% + 8px)"
        role="menu"
      >
        <!-- User info header -->
        <div class="flex items-center gap-2.5 px-3.5 py-3" style="background: var(--bg-overlay)">
          <span
            class="tn-avatar w-9 h-9 rounded-[10px] flex items-center justify-center font-extrabold text-[0.78rem] text-white flex-shrink-0"
            style="font-family: 'Exo 2', system-ui, sans-serif"
            >{{ userInitials }}</span
          >
          <div>
            <div
              class="text-[0.84rem] font-bold"
              style="color: var(--text-primary); font-family: 'Exo 2', system-ui, sans-serif"
            >
              {{ userName }}
            </div>
            <div class="text-[0.64rem] mt-[1px]" style="color: var(--text-muted)">
              {{ userRole }}
            </div>
          </div>
        </div>

        <div class="h-px" style="background: var(--border-glass)"></div>

        <!-- Profile -->
        <button
          (click)="navigateToProfile()"
          class="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-[0.82rem] font-medium cursor-pointer transition-all duration-150 text-left hover:bg-[var(--bg-overlay)]"
          style="color: var(--text-secondary)"
          role="menuitem"
        >
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          Profile
        </button>

        <!-- Settings -->
        <button
          (click)="navigateToSettings()"
          class="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-[0.82rem] font-medium cursor-pointer transition-all duration-150 text-left hover:bg-[var(--bg-overlay)]"
          style="color: var(--text-secondary)"
          role="menuitem"
        >
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
          Settings
        </button>

        <div class="h-px" style="background: var(--border-glass)"></div>

        <!-- Sign out -->
        <button
          (click)="signOut()"
          class="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-[0.82rem] font-medium cursor-pointer transition-all duration-150 text-left hover:bg-[rgba(244,63,94,.08)]"
          style="color: #f43f5e"
          role="menuitem"
        >
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          Sign out
        </button>
      </div>
    </div>
  </div>
</div>
