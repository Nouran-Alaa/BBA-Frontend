<nav class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200">
  <!-- Left Section: Menu Toggle Button + Company Name -->
  <div class="flex items-center gap-4">
    <!-- Hamburger Menu for Mobile -->
    <button
      (click)="onMenuToggle()"
      class="p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200 lg:hidden focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
      aria-label="Toggle Menu"
    >
      <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
    </button>

    <!-- Company Name/Logo (Visible on Mobile when sidebar is closed) -->
    <div class="flex items-center gap-2 cursor-pointer" routerLink="/dashboard">
      <span
        class="text-xl lg:text-2xl font-bold"
        style="color: var(--text-primary); text-shadow: var(--shadow-sm)"
        >BigBrother</span
      >
      <span class="text-sm lg:text-base mt-1" style="color: var(--text-muted)">Analytics</span>
    </div>
  </div>

  <!-- Right Section: User Profile & Actions -->
  <div class="flex items-center gap-4">
    <!-- Theme Toggle -->
    <button
      (click)="themeService.toggleTheme()"
      class="btn-ghost w-9 h-9 rounded-lg flex items-center justify-center transition-all"
      [title]="
        (themeService.theme$ | async) === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'
      "
    >
      <!-- Sun icon (show in dark mode) -->
      <svg
        *ngIf="(themeService.theme$ | async) === 'dark'"
        class="w-5 h-5"
        style="color: var(--accent-primary)"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
        ></path>
      </svg>
      <!-- Moon icon (show in light mode) -->
      <svg
        *ngIf="(themeService.theme$ | async) !== 'dark'"
        class="w-5 h-5"
        style="color: var(--accent-primary)"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        ></path>
      </svg>
    </button>

    <!-- User Profile Dropdown -->
    <div class="relative" #profileDropdown>
      <!-- Profile Button -->
      <button
        (click)="toggleProfileMenu()"
        class="flex items-center gap-3 p-2 rounded-lg transition-colors cursor-pointer hover-glass"
        style="color: var(--text-primary)"
        aria-label="User Menu"
      >
        <!-- User Avatar -->
        <img
          [src]="currentUser.profileImage"
          [alt]="currentUser.name"
          class="w-9 h-9 rounded-full border-2 border-gray-200 object-cover"
        />

        <!-- User Info (Hidden on mobile) -->
        <div class="hidden md:block text-left">
          <p
            class="text-sm font-medium"
            style="color: var(--text-primary); text-shadow: var(--shadow-sm)"
          >
            {{ currentUser.name }}
          </p>
          <p class="text-xs" style="color: var(--text-muted)">{{ currentUser.role }}</p>
        </div>

        <!-- Dropdown Arrow -->
        <svg
          class="w-4 h-4 text-gray-600 transition-transform duration-200 hidden sm:block"
          [class.rotate-180]="isProfileMenuOpen"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          ></path>
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div
        *ngIf="isProfileMenuOpen"
        class="absolute right-0 mt-2 w-56 glass-dropdown rounded-xl z-50 animate-fadeIn"
      >
        <!-- User Info in Dropdown (Mobile View) -->
        <div class="px-4 py-3 border-b border-gray-200 md:hidden">
          <p
            class="text-sm font-medium"
            style="color: var(--text-primary); text-shadow: var(--shadow-sm)"
          >
            {{ currentUser.name }}
          </p>
          <p class="text-xs" style="color: var(--text-muted)">{{ currentUser.email }}</p>
        </div>

        <!-- Menu Items -->
        <a
          (click)="goToProfile()"
          class="flex items-center gap-3 px-4 py-4 text-sm text-gray-700 hover-glass transition-colors duration-150 cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            ></path>
          </svg>
          <span>View Profile</span>
        </a>

        <!-- Divider -->
        <div class="border-t border-gray-200"></div>

        <!-- Logout -->
        <button
          (click)="logout()"
          class="flex items-center gap-3 px-4 py-4 text-sm text-red-600 rounded-b-xl hover:bg-red-100/20 transition-colors duration-150 w-full text-left cursor-pointer"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            ></path>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</nav>
