<!-- chatbot.component.html — Space theme, Tailwind-first, functionality 100% unchanged -->
<div class="fixed bottom-4 right-4 z-[9999] flex flex-col" [class.minimized]="isMinimized">
  <!-- ══ CHAT WINDOW ══════════════════════════════════════════════ -->
  <div
    *ngIf="!isMinimized"
    class="glass-heavy rounded-2xl shadow-2xl overflow-hidden flex flex-col chat-window-enter"
    style="width: 400px; height: 600px; border: 1px solid var(--border-glass)"
  >
    <!-- Header -->
    <div
      class="px-4 py-3 flex items-center justify-between flex-shrink-0"
      style="background: var(--accent-gradient); color: var(--text-on-accent)"
    >
      <div class="flex items-center gap-3">
        <!-- Bot icon -->
        <div
          class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
          style="background: rgba(255, 255, 255, 0.2)"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
            />
          </svg>
        </div>

        <!-- Title + context dropdown -->
        <div class="flex-1 min-w-0 context-dropdown-container relative">
          <h3 class="font-bold text-sm">Dashboard Assistant</h3>
          <button
            (click)="toggleContextDropdown($event)"
            class="flex items-center gap-1 text-xs opacity-90 cursor-pointer context-label transition-opacity hover:opacity-100"
            type="button"
          >
            <span class="truncate max-w-[150px]">{{ getContextLabel() }}</span>
            <svg
              class="w-3 h-3 flex-shrink-0 transition-transform"
              [class.rotate-180]="showContextDropdown"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <!-- Context dropdown -->
          <div
            *ngIf="showContextDropdown"
            class="absolute top-full left-0 mt-2 w-64 rounded-xl shadow-2xl overflow-hidden z-50 dropdown-menu"
            style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
          >
            <!-- Current Dashboard -->
            <button
              (click)="selectContext('current', undefined, $event)"
              type="button"
              class="w-full px-4 py-3 flex items-center gap-3 text-left transition-colors dropdown-item hover:bg-[var(--bg-overlay)]"
              [style.background]="contextMode === 'current' ? 'var(--bg-overlay)' : 'transparent'"
              style="color: var(--text-primary)"
            >
              <svg
                class="w-5 h-5 flex-shrink-0"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                />
              </svg>
              <div class="flex-1 min-w-0">
                <p class="font-medium text-sm">Current Dashboard</p>
                <p class="text-xs opacity-70">Active dashboard only</p>
              </div>
              <svg
                *ngIf="contextMode === 'current'"
                class="w-5 h-5 checkmark-icon"
                style="color: var(--accent-primary)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                />
              </svg>
            </button>

            <!-- All Dashboards -->
            <button
              (click)="selectContext('all', undefined, $event)"
              type="button"
              class="w-full px-4 py-3 flex items-center gap-3 text-left transition-colors dropdown-item hover:bg-[var(--bg-overlay)]"
              [style.background]="contextMode === 'all' ? 'var(--bg-overlay)' : 'transparent'"
              style="color: var(--text-primary)"
            >
              <svg
                class="w-5 h-5 flex-shrink-0"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"
                />
              </svg>
              <div class="flex-1 min-w-0">
                <p class="font-medium text-sm">All Dashboards</p>
                <p class="text-xs opacity-70">Access all data</p>
              </div>
              <svg
                *ngIf="contextMode === 'all'"
                class="w-5 h-5 checkmark-icon"
                style="color: var(--accent-primary)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                />
              </svg>
            </button>

            <div
              *ngIf="getAllDashboards().length > 0"
              class="h-px"
              style="background: var(--border-subtle)"
            ></div>

            <!-- Top 3 dashboards -->
            <div *ngIf="getAllDashboards().length > 0">
              <button
                *ngFor="let dashboard of getTopDashboards()"
                (click)="selectContext('specific', dashboard.id, $event)"
                type="button"
                class="w-full px-4 py-2.5 flex items-center gap-3 text-left transition-colors dropdown-item hover:bg-[var(--bg-overlay)]"
                [style.background]="
                  contextMode === 'specific' && selectedDashboardId === dashboard.id
                    ? 'var(--bg-overlay)'
                    : 'transparent'
                "
                style="color: var(--text-primary)"
              >
                <svg
                  class="w-4 h-4 flex-shrink-0"
                  style="color: var(--text-muted)"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                  />
                </svg>
                <span class="flex-1 text-sm truncate">{{ dashboard.name }}</span>
                <svg
                  *ngIf="contextMode === 'specific' && selectedDashboardId === dashboard.id"
                  class="w-4 h-4 checkmark-icon"
                  style="color: var(--accent-primary)"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              </button>

              <!-- More dashboards -->
              <button
                *ngIf="hasMoreDashboards()"
                (click)="toggleDashboardListExpanded($event)"
                type="button"
                class="w-full px-4 py-2.5 flex items-center justify-between gap-2 text-left transition-colors hover:bg-[var(--bg-overlay)]"
                style="color: var(--text-muted); background: var(--bg-overlay)"
              >
                <span class="text-xs font-medium"
                  >+{{ getMoreDashboardsCount() }} more dashboard{{
                    getMoreDashboardsCount() > 1 ? 's' : ''
                  }}</span
                >
                <svg
                  class="w-4 h-4 transition-transform"
                  [class.rotate-180]="showDashboardListExpanded"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </button>
              <div *ngIf="showDashboardListExpanded" class="max-h-48 overflow-y-auto">
                <button
                  *ngFor="let dashboard of getRemainingDashboards()"
                  (click)="selectContext('specific', dashboard.id, $event)"
                  type="button"
                  class="w-full px-4 py-2.5 flex items-center gap-3 text-left transition-colors dropdown-item hover:bg-[var(--bg-overlay)]"
                  [style.background]="
                    contextMode === 'specific' && selectedDashboardId === dashboard.id
                      ? 'var(--bg-overlay)'
                      : 'transparent'
                  "
                  style="color: var(--text-primary)"
                >
                  <svg
                    class="w-4 h-4 flex-shrink-0"
                    style="color: var(--text-muted)"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                    />
                  </svg>
                  <span class="flex-1 text-sm truncate">{{ dashboard.name }}</span>
                  <svg
                    *ngIf="contextMode === 'specific' && selectedDashboardId === dashboard.id"
                    class="w-4 h-4 checkmark-icon"
                    style="color: var(--accent-primary)"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div
              *ngIf="availableDashboards.length === 0"
              class="px-4 py-3 text-center text-xs"
              style="color: var(--text-muted)"
            >
              No dashboards available
            </div>
          </div>
        </div>
      </div>

      <!-- Header action buttons -->
      <div class="flex items-center gap-2">
        <button
          (click)="clearChat()"
          class="p-1.5 rounded-lg cursor-pointer header-button"
          style="background: rgba(255, 255, 255, 0.15)"
          title="Clear chat"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
        <button
          (click)="toggleMinimize()"
          class="p-1.5 rounded-lg cursor-pointer header-button"
          style="background: rgba(255, 255, 255, 0.15)"
          title="Minimize"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
          </svg>
        </button>
        <button
          (click)="onClose()"
          class="p-1.5 rounded-lg cursor-pointer header-button"
          style="background: rgba(255, 255, 255, 0.15)"
          title="Close"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Messages ─────────────────────────────────────────────── -->
    <div
      #messageContainer
      class="flex-1 overflow-y-auto p-4 space-y-4"
      style="background: var(--bg-secondary)"
    >
      <div
        *ngFor="let message of messages$ | async"
        class="flex"
        [class.justify-end]="message.role === 'user'"
        [class.message-user]="message.role === 'user'"
        [class.message-assistant]="message.role === 'assistant'"
      >
        <div class="max-w-[80%]">
          <!-- Bubble -->
          <div
            class="rounded-2xl px-4 py-2.5 shadow-sm"
            [style.background]="
              message.role === 'user' ? 'var(--accent-gradient)' : 'var(--bg-card)'
            "
            [style.color]="
              message.role === 'user' ? 'var(--text-on-accent)' : 'var(--text-primary)'
            "
          >
            <p class="text-sm whitespace-pre-line leading-relaxed">{{ message.content }}</p>
          </div>

          <!-- Template action button -->
          <button
            *ngIf="message.templateId && message.role === 'assistant'"
            (click)="createDashboardFromTemplate(message.templateId)"
            type="button"
            class="mt-2 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer text-white template-button"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
          >
            ✨ Create This Dashboard
          </button>

          <!-- Suggestions -->
          <div
            *ngIf="message.suggestions && message.suggestions.length > 0"
            class="mt-2 flex flex-wrap gap-2"
          >
            <button
              *ngFor="let suggestion of message.suggestions; let i = index"
              (click)="useSuggestion(suggestion)"
              type="button"
              class="px-3 py-1.5 text-xs rounded-lg cursor-pointer suggestion-chip suggestion-button"
              [style.animation-delay]="i * 50 + 'ms'"
              style="
                background: var(--bg-overlay);
                color: var(--text-primary);
                border: 1px solid var(--border-subtle);
              "
              onmouseover="
                this.style.background = 'var(--accent-gradient)';
                this.style.color = 'var(--text-on-accent)';
                this.style.borderColor = 'transparent';
              "
              onmouseout="
                this.style.background = 'var(--bg-overlay)';
                this.style.color = 'var(--text-primary)';
                this.style.borderColor = 'var(--border-subtle)';
              "
            >
              {{ suggestion }}
            </button>
          </div>

          <!-- Timestamp -->
          <p
            class="text-xs mt-1 message-timestamp"
            [class.text-right]="message.role === 'user'"
            style="color: var(--text-muted); opacity: 0.6"
          >
            {{ message.timestamp | date: 'shortTime' }}
          </p>
        </div>
      </div>

      <!-- Typing indicator -->
      <div *ngIf="isTyping" class="flex items-center gap-2 message-assistant">
        <div class="px-4 py-3 rounded-2xl" style="background: var(--bg-card)">
          <div class="flex gap-1.5">
            <div
              class="w-2 h-2 rounded-full animate-bounce"
              style="background: var(--text-muted); animation-delay: 0ms"
            ></div>
            <div
              class="w-2 h-2 rounded-full animate-bounce"
              style="background: var(--text-muted); animation-delay: 200ms"
            ></div>
            <div
              class="w-2 h-2 rounded-full animate-bounce"
              style="background: var(--text-muted); animation-delay: 400ms"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Input ────────────────────────────────────────────────── -->
    <div
      class="p-4 flex-shrink-0"
      style="background: var(--bg-card); border-top: 1px solid var(--border-subtle)"
    >
      <div class="flex gap-2 items-end">
        <textarea
          [(ngModel)]="userInput"
          (keydown)="handleKeyPress($event)"
          placeholder="Ask me anything..."
          rows="1"
          class="flex-1 px-4 py-2.5 rounded-xl resize-none text-sm transition-all"
          style="
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            max-height: 100px;
          "
        ></textarea>
        <button
          (click)="sendMessage()"
          [disabled]="!userInput.trim()"
          class="px-4 py-2.5 rounded-xl cursor-pointer text-white flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed send-button"
          style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ══ CHART DESTINATION MODAL ══════════════════════════════════ -->
  <div
    *ngIf="showChartDestinationModal && pendingChartData"
    class="fixed inset-0 z-[10000] flex items-center justify-center p-4"
    style="background: rgba(0, 0, 0, 0.5)"
    (click)="showChartDestinationModal = false"
  >
    <div
      class="glass-heavy rounded-2xl shadow-2xl p-6 max-w-md w-full"
      style="border: 1px solid var(--border-glass)"
      (click)="$event.stopPropagation()"
    >
      <h3 class="text-lg font-bold mb-2" style="color: var(--text-primary)">
        📊 Where to add this chart?
      </h3>
      <p class="text-sm mb-4" style="color: var(--text-secondary)">
        "{{ pendingChartData.title }}"
      </p>

      <div class="space-y-2">
        <!-- Current dashboard -->
        <button
          *ngIf="contextMode === 'current' || contextMode === 'specific'"
          (click)="selectChartDestination('current')"
          type="button"
          class="w-full px-4 py-3 rounded-lg text-left flex items-center gap-3 transition-all hover:border-[color:var(--accent-primary)]"
          style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
        >
          <svg
            class="w-5 h-5"
            style="color: var(--accent-primary)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
            />
          </svg>
          <div>
            <p class="font-medium text-sm" style="color: var(--text-primary)">
              Add to Current Dashboard
            </p>
            <p class="text-xs" style="color: var(--text-muted)">{{ getContextLabel() }}</p>
          </div>
        </button>

        <!-- Other dashboards -->
        <div class="relative other-dashboards-dropdown">
          <button
            (click)="toggleOtherDashboardsDropdown($event)"
            type="button"
            class="w-full px-4 py-3 rounded-lg text-left flex items-center justify-between gap-3 transition-all hover:border-[color:var(--accent-primary)]"
            style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
          >
            <div class="flex items-center gap-3">
              <svg
                class="w-5 h-5"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5z"
                />
              </svg>
              <p class="font-medium text-sm" style="color: var(--text-primary)">
                Add to Other Dashboard
              </p>
            </div>
            <svg
              class="w-4 h-4 transition-transform"
              [class.rotate-180]="showOtherDashboardsDropdown"
              style="color: var(--text-muted)"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>
          <div
            *ngIf="showOtherDashboardsDropdown"
            class="absolute top-full left-0 right-0 mt-1 rounded-lg shadow-xl overflow-hidden z-50 max-h-48 overflow-y-auto dropdown-menu"
            style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
          >
            <button
              *ngFor="let dashboard of getAllDashboards()"
              (click)="selectChartDestination('other', dashboard.id)"
              type="button"
              class="w-full px-4 py-2.5 text-left transition-colors flex items-center gap-2 hover:bg-[var(--bg-overlay)]"
              style="color: var(--text-primary)"
            >
              <svg
                class="w-4 h-4"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                />
              </svg>
              <span class="text-sm">{{ dashboard.name }}</span>
            </button>
          </div>
        </div>

        <!-- Create another chart -->
        <button
          (click)="selectChartDestination('new-chart')"
          type="button"
          class="w-full px-4 py-3 rounded-lg text-left flex items-center gap-3 transition-all hover:border-[color:var(--accent-primary)]"
          style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
        >
          <svg
            class="w-5 h-5"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          <p class="font-medium text-sm" style="color: var(--text-primary)">Create Another Chart</p>
        </button>

        <!-- Create new dashboard -->
        <button
          (click)="selectChartDestination('new-dashboard')"
          type="button"
          class="w-full px-4 py-3 rounded-lg text-left flex items-center gap-3 transition-all hover:-translate-y-0.5"
          style="
            background: var(--accent-gradient);
            color: var(--text-on-accent);
            box-shadow: var(--shadow-md);
          "
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <div>
            <p class="font-medium text-sm">Create New Dashboard</p>
            <p class="text-xs opacity-90">Start fresh with this chart</p>
          </div>
        </button>
      </div>

      <button
        (click)="showChartDestinationModal = false"
        type="button"
        class="mt-4 w-full px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition-all hover:bg-[var(--bg-card)]"
        style="
          background: var(--bg-overlay);
          color: var(--text-primary);
          border: 1px solid var(--border-subtle);
        "
      >
        Cancel
      </button>
    </div>
  </div>

  <!-- ══ MINIMIZED BUTTON ══════════════════════════════════════════ -->
  <button
    *ngIf="isMinimized"
    (click)="toggleMinimize()"
    type="button"
    class="w-14 h-14 rounded-full flex items-center justify-center shadow-2xl cursor-pointer floating-button"
    style="background: var(--accent-gradient); color: var(--text-on-accent)"
  >
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      />
    </svg>
  </button>
</div>
