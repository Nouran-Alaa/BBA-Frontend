<div class="flex flex-col h-screen overflow-visible" style="color: var(--text-primary)">
  <!-- Logo Section -->
  <div
    class="flex items-center justify-between p-4 flex-shrink-0"
    style="border-bottom: 1px solid var(--border-glass)"
    [class.px-2]="collapsed"
  >
    <!-- Logo and Company Name -->
    <div class="flex items-center gap-3 overflow-hidden">
      <!-- Logo Image -->
      <div class="relative flex-shrink-0">
        <img
          [src]="companyLogo || fallbackLogo"
          alt="Company Logo"
          class="w-10 h-10 rounded-lg object-cover border-2 transition-transform duration-200 hover:scale-105"
          style="border-color: var(--border-glass)"
          [class.w-8]="collapsed"
          [class.h-8]="collapsed"
        />

        <!-- Upload Button (Super Admin Only) -->
        <button
          *ngIf="isSuperAdmin() && !collapsed"
          (click)="logoInput.click()"
          class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center shadow-lg cursor-pointer transition-colors"
          style="background: var(--accent-primary)"
          title="Upload Logo"
        >
          <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
        </button>

        <input
          #logoInput
          type="file"
          accept="image/*"
          (change)="uploadLogo($event)"
          class="hidden"
        />
      </div>

      <!-- Company Name -->
      <div *ngIf="!collapsed" class="transition-all duration-300">
        <h1 class="text-lg font-bold" style="color: var(--text-primary)">My Company</h1>
        <p class="text-xs" style="color: var(--text-muted)">Analytics</p>
      </div>
    </div>

    <!-- Close Button (Mobile Only) -->
    <button
      (click)="toggleSidebar()"
      class="p-2 rounded-lg transition-colors lg:hidden cursor-pointer hover-glass"
      style="color: var(--text-muted)"
      aria-label="Close Sidebar"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Dashboards Section - Scrollable -->
  <div class="flex-1 overflow-y-auto py-4">
    <!-- Section Title -->
    <div *ngIf="!collapsed" class="px-4 mb-3">
      <h2 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-muted)">
        Dashboards
      </h2>
    </div>

    <!-- Dashboard List -->
    <nav class="space-y-1 px-2">
      <div *ngFor="let dashboard of dashboards" class="relative group">
        <button
          (click)="selectDashboard(dashboard.id)"
          [style.background]="
            activeDashboardId === dashboard.id ? 'var(--accent-gradient)' : 'transparent'
          "
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 relative cursor-pointer"
          [style.boxShadow]="activeDashboardId === dashboard.id ? 'var(--shadow-sm)' : 'none'"
          [class.hover-glass]="activeDashboardId !== dashboard.id"
          [class.justify-center]="collapsed"
          [title]="collapsed ? dashboard.name : ''"
        >
          <!-- Dashboard Icon -->
          <span class="text-2xl flex-shrink-0" [class.text-xl]="collapsed">
            {{ dashboard.icon || '📊' }}
          </span>

          <!-- Dashboard Name -->
          <span
            *ngIf="!collapsed"
            class="text-sm font-medium text-left flex-1 truncate"
            [style.color]="
              activeDashboardId === dashboard.id ? 'var(--text-on-accent)' : 'var(--text-primary)'
            "
          >
            {{ dashboard.name }}
          </span>

          <!-- Context Menu Button (Super Admin Only) -->
          <button
            *ngIf="isSuperAdmin() && !collapsed"
            (click)="openDashboardMenu(dashboard, $event)"
            class="opacity-0 group-hover:opacity-100 p-1 rounded transition-all cursor-pointer hover-glass"
            title="Dashboard options"
          >
            <svg
              class="w-4 h-4"
              style="color: var(--text-primary)"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"
              ></path>
            </svg>
          </button>

          <!-- Default Badge -->
          <span
            *ngIf="dashboard.isDefault && !collapsed"
            class="px-2 py-0.5 text-white text-xs rounded-full"
            style="background: var(--accent-tertiary)"
          >
            Default
          </span>

          <!-- Active Indicator (when collapsed) -->
          <div
            *ngIf="collapsed && activeDashboardId === dashboard.id"
            class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-8 rounded-r-full"
            style="background: var(--accent-primary)"
          ></div>
        </button>
      </div>

      <!-- Add New Dashboard Button (Super Admin Only) -->
      <button
        *ngIf="isSuperAdmin()"
        (click)="addNewDashboard()"
        class="group w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 border-2 border-dashed cursor-pointer hover-glass justify-center"
        style="border-color: var(--border-glass); color: var(--text-muted)"
        [title]="collapsed ? 'Add New Dashboard' : ''"
      >
        <!-- Plus Icon -->
        <div
          class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 transition-all duration-200 group-hover:scale-110"
          style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
        >
          <svg class="w-4.5 h-4.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
        </div>

        <!-- Add Text -->
        <span *ngIf="!collapsed" class="text-sm font-medium"> Add Dashboard </span>
      </button>
    </nav>
  </div>

  <!-- Footer Section - Fixed at Bottom -->
  <div
    class="p-4 flex-shrink-0 mt-auto"
    style="border-top: 1px solid var(--border-glass)"
    [class.px-2]="collapsed"
  >
    <button
      class="w-full flex items-center gap-3 px-3 py-2 rounded-lg transition-colors cursor-pointer hover:glass"
      [class.justify-center]="collapsed"
      style="color: var(--text-muted)"
      [title]="collapsed ? 'Settings' : ''"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
        ></path>
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
        ></path>
      </svg>
      <span *ngIf="!collapsed" class="text-sm"> Settings </span>
    </button>
  </div>

  <!-- MODALS - rendered here (at component root, not inside the scroll nav) -->
  <app-dashboard-templates-modal
    *ngIf="showTemplatesModal"
    (close)="showTemplatesModal = false"
    (selectTemplate)="onTemplateSelected($event)"
  ></app-dashboard-templates-modal>

  <app-dashboard-menu-modal
    *ngIf="showDashboardMenu && selectedDashboardForMenu"
    [dashboard]="selectedDashboardForMenu"
    (close)="showDashboardMenu = false"
    (rename)="onDashboardRename($event)"
    (duplicate)="onDashboardDuplicate(selectedDashboardForMenu)"
    (delete)="onDashboardDelete()"
  ></app-dashboard-menu-modal>
</div>
