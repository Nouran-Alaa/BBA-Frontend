<!-- side-nav.component.html  ─ v3 FINAL
     ✓ NO X close button anywhere
     ✓ NO collapse toggle inside the sidebar (hamburger in top-nav handles this)
     ✓ Collapsed state = icon-only (like reference image 2)
     ✓ All original logic/bindings/modals unchanged
     Place at: src/app/shared/components/layout/side-nav/side-nav.component.html
-->
<div
  style="
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    position: relative;
    color: var(--text-primary);
  "
>
  <!-- Scan-line animation (dark mode only, CSS-driven) -->
  <div class="sn-scanline" aria-hidden="true"></div>

  <!-- ════ HEADER ═══════════════════════════════════════════════ -->
  <div
    style="
      display: flex;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-glass);
      flex-shrink: 0;
      min-height: 56px;
    "
    [style.justify-content]="collapsed ? 'center' : 'flex-start'"
    [style.gap]="collapsed ? '0' : '10px'"
  >
    <!-- Logo with glow ring -->
    <div style="position: relative; flex-shrink: 0">
      <div class="sn-logo-ring"></div>
      <img
        [src]="companyLogo || fallbackLogo"
        alt="Logo"
        [style.width]="collapsed ? '32px' : '36px'"
        [style.height]="collapsed ? '32px' : '36px'"
        style="
          border-radius: 9px;
          border: 1.5px solid rgba(0, 200, 255, 0.22);
          object-fit: cover;
          position: relative;
          z-index: 1;
          display: block;
          transition: all 0.3s;
        "
      />
      <!-- Upload button — super admin + expanded only -->
      <div
        *ngIf="isSuperAdmin() && !collapsed"
        (click)="logoInput.click()"
        style="
          position: absolute;
          bottom: -3px;
          right: -3px;
          width: 15px;
          height: 15px;
          border-radius: 50%;
          background: var(--accent-primary);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2;
          box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
        "
        title="Upload Logo"
      >
        <svg width="8" height="8" fill="none" stroke="white" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="3"
            d="M12 4v16m8-8H4"
          />
        </svg>
      </div>
      <input
        #logoInput
        type="file"
        accept="image/*"
        (change)="uploadLogo($event)"
        style="display: none"
      />
    </div>

    <!-- Company name — hidden when collapsed -->
    <div *ngIf="!collapsed" style="overflow: hidden; flex: 1; min-width: 0">
      <div class="sn-company-name">My Company</div>
      <div class="sn-company-sub">Analytics</div>
    </div>
  </div>
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- ════ DASHBOARD LIST ════════════════════════════════════════ -->
  <div style="flex: 1; overflow-y: auto; padding: 8px 0" class="sn-scroll">
    <!-- Section label — hidden when collapsed -->
    <div
      *ngIf="!collapsed"
      style="
        padding: 0 12px 6px;
        font-size: 0.58rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-muted);
        font-family: 'Exo 2', system-ui, sans-serif;
      "
    >
      Dashboards
    </div>

    <div style="padding: 0 6px; display: flex; flex-direction: column; gap: 1px">
      <!-- Dashboard items -->
      <div *ngFor="let dashboard of dashboards" style="position: relative" class="sn-group">
        <div
          (click)="selectDashboard(dashboard.id)"
          class="sn-nav-item"
          [class.sn-nav-item-active]="activeDashboardId === dashboard.id"
          [style.padding]="collapsed ? '9px 6px' : '7px 8px'"
          [style.justify-content]="collapsed ? 'center' : 'flex-start'"
          [attr.title]="collapsed ? dashboard.name : null"
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 9px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
            transition: all 0.2s;
          "
        >
          <div *ngIf="activeDashboardId === dashboard.id" class="sn-active-bar"></div>

          <!-- Icon -->
          <div
            style="
              width: 28px;
              height: 28px;
              border-radius: 7px;
              display: flex;
              align-items: center;
              justify-content: center;
              flex-shrink: 0;
              transition: all 0.18s;
            "
            [style.background]="
              activeDashboardId === dashboard.id ? 'rgba(0,200,255,0.12)' : 'transparent'
            "
          >
            <lucide-icon
              *ngIf="getDashboardIcon(dashboard.iconId) as icon"
              [img]="icon"
              [size]="collapsed ? 18 : 16"
              [style.color]="
                activeDashboardId === dashboard.id
                  ? 'var(--accent-primary)'
                  : 'var(--text-secondary)'
              "
            ></lucide-icon>
          </div>

          <!-- Label -->
          <span
            *ngIf="!collapsed"
            style="
              font-family: 'Exo 2', system-ui, sans-serif;
              font-size: 0.82rem;
              flex: 1;
              text-align: left;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            "
            [style.color]="
              activeDashboardId === dashboard.id ? 'var(--accent-primary)' : 'var(--text-secondary)'
            "
            [style.font-weight]="activeDashboardId === dashboard.id ? '600' : '500'"
          >
            {{ dashboard.name }}
          </span>

          <!-- Default badge -->
          <span
            *ngIf="dashboard.isDefault && !collapsed"
            style="
              font-size: 0.55rem;
              font-weight: 700;
              padding: 2px 6px;
              border-radius: 99px;
              background: var(--accent-tertiary);
              color: #fff;
              flex-shrink: 0;
              white-space: nowrap;
            "
          >
            Default
          </span>

          <!-- 3-dot menu (super admin, expanded only) — span NOT button -->
          <span
            *ngIf="isSuperAdmin() && !collapsed"
            (click)="openDashboardMenu(dashboard, $event)"
            class="sn-dot-menu"
            title="Options"
          >
            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"
              />
            </svg>
          </span>
        </div>
      </div>

      <!-- Add dashboard (super admin only) -->
      <div
        *ngIf="isSuperAdmin()"
        (click)="addNewDashboard()"
        class="sn-add-btn"
        [style.justify-content]="collapsed ? 'center' : 'flex-start'"
        [style.padding]="collapsed ? '9px 6px' : '7px 8px'"
        [attr.title]="collapsed ? 'Add Dashboard' : null"
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          border-radius: 9px;
          cursor: pointer;
          border: 1px dashed var(--border-glass);
          color: var(--text-muted);
          margin-top: 4px;
          transition: all 0.2s;
        "
      >
        <div
          style="
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent-gradient);
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
          "
        >
          <svg width="12" height="12" fill="none" stroke="white" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </div>
        <span *ngIf="!collapsed" style="font-size: 0.82rem; font-weight: 500">Add Dashboard</span>
      </div>
    </div>
  </div>
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- ════ FOOTER ════════════════════════════════════════════════ -->
  <div style="padding: 6px; border-top: 1px solid var(--border-glass); flex-shrink: 0">
    <div
      class="sn-nav-item"
      [style.padding]="collapsed ? '9px 6px' : '7px 8px'"
      [style.justify-content]="collapsed ? 'center' : 'flex-start'"
      [attr.title]="collapsed ? 'Settings' : null"
      style="
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 9px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s;
        color: var(--text-muted);
      "
    >
      <div
        style="
          width: 28px;
          height: 28px;
          border-radius: 7px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        "
      >
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
      </div>
      <span *ngIf="!collapsed" style="font-size: 0.82rem">Settings</span>
    </div>
  </div>
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- MODALS — logic completely unchanged -->
  <app-dashboard-templates-modal
    *ngIf="showTemplatesModal"
    (close)="showTemplatesModal = false"
    (selectTemplate)="onTemplateSelected($event)"
  ></app-dashboard-templates-modal>

  <app-dashboard-menu-modal
    *ngIf="showDashboardMenu && selectedDashboardForMenu"
    [dashboard]="selectedDashboardForMenu"
    (close)="showDashboardMenu = false"
    (rename)="onDashboardRename($event)"
    (duplicate)="onDashboardDuplicate(selectedDashboardForMenu)"
    (delete)="onDashboardDelete()"
  ></app-dashboard-menu-modal>
</div>
