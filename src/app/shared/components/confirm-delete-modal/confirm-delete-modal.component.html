<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background-color: rgba(0, 0, 0, 0.3)"
  (click)="onCancel()"
>
  <div
    class="rounded-xl shadow-2xl max-w-md w-full animate-scaleUp overflow-hidden"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="px-6 py-4 rounded-t-xl">
      <div class="flex items-center gap-3">
        <div
          class="w-11 h-11 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0"
        >
          <svg class="w-9 h-9 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            ></path>
          </svg>
        </div>
        <div class="flex-1">
          <h2 class="text-xl font-bold" style="color: var(--text-primary)">Confirm Delete</h2>
          <p class="text-sm" style="color: var(--text-secondary)">This action cannot be undone</p>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="p-6">
      <p class="mb-2" style="color: var(--text-secondary)">
        Are you sure you want to delete this {{ itemType }}?
      </p>
      <div
        class="rounded-lg p-3"
        style="background: var(--bg-hover); border: 1px solid var(--border-subtle)"
      >
        <p class="font-semibold" style="color: var(--text-primary)">"{{ itemName }}"</p>
      </div>
      <p class="text-sm mt-3" style="color: var(--text-muted)">
        All associated data and configurations will be permanently removed.
      </p>
    </div>

    <!-- Footer -->
    <div
      class="px-6 py-4 flex justify-end gap-3"
      style="border-top: 1px solid var(--border-subtle)"
    >
      <button
        (click)="onCancel()"
        class="px-5 py-2 rounded-lg font-medium cursor-pointer transition-colors hover-glass"
        style="
          background: var(--bg-overlay);
          color: var(--text-secondary);
          border: 1px solid var(--border-subtle);
        "
      >
        Cancel
      </button>
      <button
        (click)="onConfirm()"
        class="px-5 py-2 bg-red-600 text-white rounded-lg font-medium cursor-pointer transition-all hover:bg-red-700"
        style="box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25)"
      >
        Delete {{ itemType }}
      </button>
    </div>
  </div>
</div>
