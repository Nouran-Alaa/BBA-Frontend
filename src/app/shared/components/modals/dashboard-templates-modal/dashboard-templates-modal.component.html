<!-- ── Templates List Modal ──────────────────────────────────────────────────── -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4"
  style="background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px)"
  (click)="onClose()"
>
  <div
    class="rounded-none sm:rounded-xl shadow-2xl w-full max-w-6xl h-screen sm:max-h-[90vh] overflow-hidden animate-slideUp flex flex-col"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div
      class="px-4 sm:px-6 py-4 text-white flex-shrink-0"
      style="background: var(--accent-gradient)"
    >
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-bold">Choose a Template</h2>
          <p class="text-xs sm:text-sm opacity-90 mt-1">
            Start with a pre-built dashboard or create your own
          </p>
        </div>
        <button
          (click)="onClose()"
          class="w-10 h-10 rounded-lg flex items-center justify-center cursor-pointer hover-glass"
          style="background: rgba(255, 255, 255, 0.15)"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div class="relative">
        <svg
          class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 opacity-70"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search templates..."
          class="modal-search-input w-full pl-12 pr-4 py-3 rounded-lg text-white placeholder-white/70 focus:outline-none font-medium"
          style="border: 1px solid rgba(255, 255, 255, 0.4)"
        />
      </div>
    </div>

    <!-- Category pills -->
    <div
      class="px-4 sm:px-6 py-3 flex-shrink-0 border-b"
      style="border-color: var(--border-subtle)"
    >
      <div class="flex gap-2 overflow-x-auto" style="scrollbar-width: none">
        <button
          *ngFor="let category of categories"
          (click)="selectedCategory = category"
          class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap transition-all cursor-pointer"
          [style.background]="
            selectedCategory === category ? 'var(--accent-gradient)' : 'var(--bg-overlay)'
          "
          [style.color]="selectedCategory === category ? '#fff' : 'var(--text-primary)'"
          [style.border]="
            '1px solid ' + (selectedCategory === category ? 'transparent' : 'var(--border-subtle)')
          "
        >
          {{ category }}
        </button>
      </div>
    </div>

    <!-- Templates grid -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <button
          *ngFor="let template of getFilteredTemplates()"
          (click)="template.id === 'blank' ? onSelectTemplate(template) : showPreview(template)"
          class="text-left p-4 sm:p-5 rounded-xl transition-all cursor-pointer flex flex-col"
          style="background: var(--bg-card); border: 2px solid var(--border-subtle)"
          onmouseover="
            this.style.borderColor = 'var(--accent-primary)';
            this.style.boxShadow = 'var(--shadow-md)';
          "
          onmouseout="
            this.style.borderColor = 'var(--border-subtle)';
            this.style.boxShadow = 'none';
          "
        >
          <div class="flex items-start justify-between mb-3">
            <div
              class="w-12 h-12 rounded-xl flex items-center justify-center"
              [style.background]="
                template.iconGradient || 'linear-gradient(135deg,#6366f1,#8b5cf6)'
              "
            >
              <lucide-icon
                *ngIf="dashboardIconService.getIcon(template.iconId) as icon"
                [img]="icon"
                [size]="24"
                class="text-white"
              ></lucide-icon>
            </div>
            <span
              class="px-2 py-1 text-xs rounded-full"
              style="background: var(--bg-overlay); color: var(--text-muted)"
            >
              {{ template.category }}
            </span>
          </div>

          <h3 class="font-semibold mb-1.5 text-sm" style="color: var(--text-primary)">
            {{ template.name }}
          </h3>
          <p class="text-xs mb-3 flex-1 leading-relaxed" style="color: var(--text-secondary)">
            {{ template.description }}
          </p>

          <div
            class="flex flex-wrap items-center gap-1.5 pt-3 border-t"
            style="border-color: var(--border-subtle)"
          >
            <ng-container *ngIf="template.widgets.length > 0; else blankCta">
              <span
                *ngFor="let chip of getWidgetChips(template)"
                class="text-[10px] font-semibold px-2 py-0.5 rounded-full"
                style="
                  background: var(--bg-overlay);
                  color: var(--text-muted);
                  border: 1px solid var(--border-subtle);
                "
              >
                {{ chip }}
              </span>
              <span class="text-[10px] font-semibold ml-auto" style="color: var(--accent-primary)">
                {{ template.widgets.length }} widgets →
              </span>
            </ng-container>
            <ng-template #blankCta>
              <span class="text-xs font-semibold" style="color: var(--accent-primary)"
                >Start from scratch →</span
              >
            </ng-template>
          </div>
        </button>
      </div>

      <div *ngIf="getFilteredTemplates().length === 0" class="text-center py-16">
        <p style="color: var(--text-muted)">No templates found</p>
      </div>
    </div>
  </div>
</div>

<!-- ── Preview Modal ─────────────────────────────────────────────────────────── -->
<div
  *ngIf="selectedTemplatePreview"
  class="fixed inset-0 z-[60] flex items-center justify-center p-2 sm:p-4"
  style="background-color: rgba(0, 0, 0, 0.82); backdrop-filter: blur(6px)"
  (click)="closePreview()"
>
  <div
    class="rounded-xl shadow-2xl w-full max-w-7xl max-h-[95vh] overflow-hidden animate-scaleUp flex flex-col"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- Preview header -->
    <div
      class="px-4 sm:px-6 py-3 sm:py-4 text-white flex-shrink-0"
      style="background: var(--accent-gradient)"
    >
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div
            class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0"
            style="background: rgba(255, 255, 255, 0.2)"
          >
            <lucide-icon
              *ngIf="dashboardIconService.getIcon(selectedTemplatePreview.iconId) as icon"
              [img]="icon"
              [size]="28"
              class="text-white"
            ></lucide-icon>
          </div>
          <div class="min-w-0 flex-1">
            <h2 class="text-lg sm:text-2xl font-bold truncate">
              {{ selectedTemplatePreview.name }}
            </h2>
            <p class="text-xs sm:text-sm opacity-90 hidden sm:block">
              {{ selectedTemplatePreview.description }}
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button
            (click)="onSelectTemplate(selectedTemplatePreview); closePreview()"
            class="px-4 sm:px-6 py-2 rounded-lg font-bold text-sm cursor-pointer hover:opacity-90 transition-opacity"
            style="background: white; color: var(--accent-primary)"
          >
            <span class="hidden sm:inline">Use Template</span>
            <span class="sm:hidden">Use</span>
          </button>
          <button
            (click)="closePreview()"
            class="w-9 h-9 rounded-lg flex items-center justify-center cursor-pointer"
            style="background: rgba(255, 255, 255, 0.15)"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Real ECharts dashboard preview -->
    <div class="flex-1 overflow-y-auto p-3 sm:p-5" style="background: var(--bg-secondary)">
      <div
        class="rounded-xl p-3 sm:p-4"
        style="background: var(--bg-card); border: 1px solid var(--border-subtle)"
      >
        <!-- 12-column grid, 160px rows -->
        <div class="grid grid-cols-12 gap-3" style="grid-auto-rows: 160px">
          <ng-container *ngFor="let widget of selectedTemplatePreview.widgets">
            <!-- Summary widget -->
            <div
              *ngIf="widget.type === 'summary'"
              class="rounded-xl p-3 flex flex-col overflow-hidden"
              [style.grid-column]="'span ' + widget.colSpan"
              [style.grid-row]="'span ' + widget.rowSpan"
              style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
            >
              <div class="flex items-center gap-2 mb-2 flex-shrink-0">
                <span class="text-lg">✨</span>
                <h3 class="font-bold text-xs truncate" style="color: var(--text-primary)">
                  {{ widget.title }}
                </h3>
              </div>
              <p
                class="text-[11px] leading-relaxed overflow-hidden"
                style="
                  color: var(--text-secondary);
                  display: -webkit-box;
                  -webkit-line-clamp: 7;
                  -webkit-box-orient: vertical;
                "
              >
                {{ widget.content }}
              </p>
            </div>

            <!-- Chart widget — real ECharts -->
            <div
              *ngIf="widget.type === 'chart'"
              class="rounded-xl flex flex-col overflow-hidden"
              [style.grid-column]="'span ' + widget.colSpan"
              [style.grid-row]="'span ' + widget.rowSpan"
              style="background: var(--bg-card); border: 1px solid var(--border-subtle)"
            >
              <!-- Mini card header -->
              <div class="flex items-center gap-1.5 px-3 pt-2.5 pb-0 flex-shrink-0">
                <span
                  class="w-1.5 h-1.5 rounded-full flex-shrink-0"
                  style="background: linear-gradient(135deg, #6366f1, #8b5cf6)"
                ></span>
                <h3
                  class="text-[11px] font-bold flex-1 truncate"
                  style="color: var(--text-primary)"
                >
                  {{ widget.title }}
                </h3>
                <span
                  class="text-[9px] font-bold px-1.5 py-px rounded text-white flex-shrink-0"
                  style="background: var(--accent-gradient)"
                >
                  {{ getChartLabel(widget.chartType) }}
                </span>
              </div>
              <!-- ECharts canvas fills remaining space -->
              <div
                class="flex-1 min-h-0 echarts-preview-host"
                echarts
                [options]="getPreviewChartOption(widget.chartType)"
                [initOpts]="initOpts"
                [autoResize]="true"
              ></div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
