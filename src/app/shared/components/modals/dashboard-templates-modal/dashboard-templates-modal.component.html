<!-- dashboard-templates-modal.component.html — NASA space theme -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4"
  style="background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px)"
  (click)="onClose()"
>
  <div
    class="dtm-panel rounded-none sm:rounded-2xl shadow-2xl w-full max-w-6xl h-screen sm:max-h-[90vh] overflow-hidden flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <!-- ── HUD corners (desktop only) ───────────────────────────── -->
    <div class="dtm-corner dtm-tl hidden sm:block" aria-hidden="true"></div>
    <div class="dtm-corner dtm-tr hidden sm:block" aria-hidden="true"></div>
    <div class="dtm-corner dtm-bl hidden sm:block" aria-hidden="true"></div>
    <div class="dtm-corner dtm-br hidden sm:block" aria-hidden="true"></div>

    <!-- ── Header ────────────────────────────────────────────────── -->
    <div
      class="relative flex-shrink-0 px-4 sm:px-6 py-4 overflow-hidden"
      style="background: var(--accent-gradient)"
    >
      <!-- Shimmer overlay -->
      <div class="dtm-header-shimmer" aria-hidden="true"></div>
      <!-- Nebula orbs inside header -->
      <div class="dtm-header-orb dtm-orb-1" aria-hidden="true"></div>
      <div class="dtm-header-orb dtm-orb-2" aria-hidden="true"></div>

      <div class="relative flex items-center justify-between mb-3 gap-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <div class="dtm-live-dot"></div>
            <span class="text-[0.58rem] font-bold uppercase tracking-[0.14em] text-white/70"
              >Template Library</span
            >
          </div>
          <h2
            class="text-xl sm:text-2xl font-extrabold text-white"
            style="font-family: 'Exo 2', system-ui, sans-serif"
          >
            Choose a Template
          </h2>
          <p class="text-xs sm:text-sm text-white/80 mt-0.5">
            Start with a pre-built dashboard or create your own
          </p>
        </div>
        <button
          (click)="onClose()"
          class="w-10 h-10 rounded-xl flex items-center justify-center cursor-pointer flex-shrink-0 transition-all duration-200 hover:scale-110 active:scale-95"
          style="background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2)"
        >
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Search -->
      <div class="relative">
        <svg
          class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-white/60"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search templates..."
          class="modal-search-input w-full pl-11 pr-4 py-2.5 rounded-xl text-white placeholder-white/55 focus:outline-none font-medium text-sm"
          style="border: 1px solid rgba(255, 255, 255, 0.28)"
        />
      </div>
    </div>

    <!-- ── Category pills ────────────────────────────────────────── -->
    <div
      class="flex-shrink-0 px-4 sm:px-6 py-3"
      style="background: var(--bg-card); border-bottom: 1px solid var(--border-subtle)"
    >
      <div class="flex gap-2 overflow-x-auto" style="scrollbar-width: none">
        <button
          *ngFor="let category of categories"
          (click)="selectedCategory = category"
          class="px-4 py-1.5 rounded-lg font-semibold text-xs whitespace-nowrap cursor-pointer transition-all duration-200 flex-shrink-0 hover:-translate-y-px"
          [style.background]="
            selectedCategory === category ? 'var(--accent-gradient)' : 'var(--bg-overlay)'
          "
          [style.color]="selectedCategory === category ? '#fff' : 'var(--text-secondary)'"
          [style.border]="
            '1px solid ' + (selectedCategory === category ? 'transparent' : 'var(--border-subtle)')
          "
          [style.box-shadow]="
            selectedCategory === category ? '0 0 16px rgba(0,150,204,.35)' : 'none'
          "
        >
          {{ category }}
        </button>
      </div>
    </div>

    <!-- ── Templates grid ────────────────────────────────────────── -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6" style="background: var(--bg-secondary)">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <button
          *ngFor="let template of getFilteredTemplates()"
          (click)="template.id === 'blank' ? onSelectTemplate(template) : showPreview(template)"
          class="dtm-card relative text-left rounded-xl cursor-pointer flex flex-col overflow-hidden transition-all duration-250 group"
          style="background: var(--bg-card); border: 1px solid var(--border-subtle)"
        >
          <!-- Card glow (hover) -->
          <div class="dtm-card-glow" aria-hidden="true"></div>
          <!-- Top accent bar -->
          <div
            class="dtm-card-bar absolute top-0 left-0 right-0 h-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-200"
            [style.background]="template.iconGradient || 'linear-gradient(90deg,#0096cc,#8b5cf6)'"
          ></div>

          <!-- Card body -->
          <div class="relative p-4 sm:p-5 flex flex-col h-full">
            <div class="flex items-start justify-between mb-3">
              <div
                class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 transition-transform duration-200 group-hover:scale-110"
                [style.background]="
                  template.iconGradient || 'linear-gradient(135deg,#6366f1,#8b5cf6)'
                "
                style="box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3)"
              >
                <lucide-icon
                  *ngIf="dashboardIconService.getIcon(template.iconId) as icon"
                  [img]="icon"
                  [size]="22"
                  class="text-white"
                ></lucide-icon>
              </div>
              <span
                class="px-2 py-1 text-[10px] font-bold rounded-full uppercase tracking-wide"
                style="
                  background: var(--bg-overlay);
                  color: var(--text-muted);
                  border: 1px solid var(--border-subtle);
                "
              >
                {{ template.category }}
              </span>
            </div>

            <h3
              class="font-bold mb-1.5 text-sm transition-colors duration-150 group-hover:text-[#0099cc]"
              style="color: var(--text-primary); font-family: 'Exo 2', system-ui, sans-serif"
            >
              {{ template.name }}
            </h3>
            <p class="text-xs mb-3 flex-1 leading-relaxed" style="color: var(--text-secondary)">
              {{ template.description }}
            </p>

            <div
              class="flex flex-wrap items-center gap-1.5 pt-3"
              style="border-top: 1px solid var(--border-subtle)"
            >
              <ng-container *ngIf="template.widgets.length > 0; else blankCta">
                <span
                  *ngFor="let chip of getWidgetChips(template)"
                  class="text-[10px] font-semibold px-2 py-0.5 rounded-full"
                  style="
                    background: var(--bg-overlay);
                    color: var(--text-muted);
                    border: 1px solid var(--border-subtle);
                  "
                >
                  {{ chip }}
                </span>
                <span
                  class="text-[10px] font-bold ml-auto transition-colors duration-150"
                  style="color: var(--accent-primary)"
                >
                  {{ template.widgets.length }} widgets →
                </span>
              </ng-container>
              <ng-template #blankCta>
                <span class="text-xs font-bold" style="color: var(--accent-primary)"
                  >Start from scratch →</span
                >
              </ng-template>
            </div>
          </div>
        </button>
      </div>
      <div *ngIf="getFilteredTemplates().length === 0" class="text-center py-16">
        <div
          class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"
          style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
        >
          <svg
            class="w-8 h-8"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
        <p class="text-sm font-medium" style="color: var(--text-muted)">No templates found</p>
      </div>
    </div>
  </div>
</div>

<!-- ── Preview Modal ──────────────────────────────────────────────────────── -->
<div
  *ngIf="selectedTemplatePreview"
  class="fixed inset-0 z-[60] flex items-center justify-center p-2 sm:p-4"
  style="background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px)"
  (click)="closePreview()"
>
  <div
    class="dtm-preview-panel rounded-xl shadow-2xl w-full max-w-7xl max-h-[95vh] overflow-hidden flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <!-- Preview header -->
    <div
      class="relative px-4 sm:px-6 py-3 sm:py-4 text-white flex-shrink-0 overflow-hidden"
      style="background: var(--accent-gradient)"
    >
      <div class="dtm-header-shimmer" aria-hidden="true"></div>
      <div class="relative flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div
            class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0"
            style="
              background: rgba(255, 255, 255, 0.2);
              border: 1px solid rgba(255, 255, 255, 0.25);
            "
          >
            <lucide-icon
              *ngIf="dashboardIconService.getIcon(selectedTemplatePreview.iconId) as icon"
              [img]="icon"
              [size]="26"
              class="text-white"
            ></lucide-icon>
          </div>
          <div class="min-w-0 flex-1">
            <h2
              class="text-lg sm:text-xl font-extrabold truncate"
              style="font-family: 'Exo 2', system-ui, sans-serif"
            >
              {{ selectedTemplatePreview.name }}
            </h2>
            <p class="text-xs opacity-80 hidden sm:block">
              {{ selectedTemplatePreview.description }}
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button
            (click)="onSelectTemplate(selectedTemplatePreview); closePreview()"
            class="px-4 sm:px-5 py-2 rounded-xl font-bold text-sm cursor-pointer transition-all duration-200 hover:-translate-y-px hover:shadow-lg"
            style="background: #fff; color: var(--accent-primary)"
          >
            <span class="hidden sm:inline">Use Template</span>
            <span class="sm:hidden">Use</span>
          </button>
          <button
            (click)="closePreview()"
            class="w-9 h-9 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-200 hover:scale-110"
            style="
              background: rgba(255, 255, 255, 0.15);
              border: 1px solid rgba(255, 255, 255, 0.2);
            "
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ECharts dashboard preview -->
    <div class="flex-1 overflow-y-auto p-3 sm:p-5" style="background: var(--bg-secondary)">
      <div
        class="rounded-xl p-3 sm:p-4"
        style="background: var(--bg-card); border: 1px solid var(--border-subtle)"
      >
        <div class="grid grid-cols-12 gap-3" style="grid-auto-rows: 160px">
          <ng-container *ngFor="let widget of selectedTemplatePreview.widgets">
            <!-- Summary widget -->
            <div
              *ngIf="widget.type === 'summary'"
              class="rounded-xl p-3 flex flex-col overflow-hidden"
              [style.grid-column]="'span ' + widget.colSpan"
              [style.grid-row]="'span ' + widget.rowSpan"
              style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
            >
              <div class="flex items-center gap-2 mb-2 flex-shrink-0">
                <span class="text-lg">✨</span>
                <h3 class="font-bold text-xs truncate" style="color: var(--text-primary)">
                  {{ widget.title }}
                </h3>
              </div>
              <p
                class="text-[11px] leading-relaxed overflow-hidden"
                style="
                  color: var(--text-secondary);
                  display: -webkit-box;
                  -webkit-line-clamp: 7;
                  -webkit-box-orient: vertical;
                "
              >
                {{ widget.content }}
              </p>
            </div>

            <!-- Chart widget -->
            <div
              *ngIf="widget.type === 'chart'"
              class="rounded-xl flex flex-col overflow-hidden"
              [style.grid-column]="'span ' + widget.colSpan"
              [style.grid-row]="'span ' + widget.rowSpan"
              style="background: var(--bg-card); border: 1px solid var(--border-subtle)"
            >
              <div class="flex items-center gap-1.5 px-3 pt-2.5 pb-0 flex-shrink-0">
                <span
                  class="w-1.5 h-1.5 rounded-full flex-shrink-0"
                  style="background: linear-gradient(135deg, #6366f1, #8b5cf6)"
                ></span>
                <h3
                  class="text-[11px] font-bold flex-1 truncate"
                  style="color: var(--text-primary)"
                >
                  {{ widget.title }}
                </h3>
                <span
                  class="text-[9px] font-bold px-1.5 py-px rounded text-white flex-shrink-0"
                  style="background: var(--accent-gradient)"
                  >{{ getChartLabel(widget.chartType) }}</span
                >
              </div>
              <div
                class="flex-1 min-h-0 echarts-preview-host"
                echarts
                [options]="getPreviewChartOption(widget.chartType)"
                [initOpts]="initOpts"
                [autoResize]="true"
              ></div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
