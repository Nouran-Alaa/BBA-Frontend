<!-- dashboard-menu-modal.component.html — space theme -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  "
  (click)="onClose()"
>
  <div
    class="dmm-panel relative w-full max-w-md rounded-2xl overflow-hidden shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- HUD corner brackets (cyan) -->
    <div class="dmm-corner dmm-tl" aria-hidden="true"></div>
    <div class="dmm-corner dmm-tr" aria-hidden="true"></div>
    <div class="dmm-corner dmm-bl" aria-hidden="true"></div>
    <div class="dmm-corner dmm-br" aria-hidden="true"></div>

    <!-- ── Header ───────────────────────────────────────────── -->
    <div
      class="relative px-5 py-4 flex items-center justify-between flex-shrink-0"
      style="border-bottom: 1px solid var(--border-subtle)"
    >
      <!-- Accent bar top -->
      <div class="dmm-top-bar"></div>
      <div>
        <p
          class="text-[0.6rem] font-bold uppercase tracking-[0.13em] mb-0.5"
          style="color: var(--accent-primary)"
        >
          Mission Control
        </p>
        <h2 class="text-base font-extrabold" style="color: var(--text-primary)">
          Dashboard Settings
        </h2>
      </div>
      <button
        (click)="onClose()"
        class="w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer transition-all duration-150 hover:opacity-70"
        style="
          color: var(--text-muted);
          border: 1px solid var(--border-subtle);
          background: var(--bg-overlay);
        "
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- ── Content ──────────────────────────────────────────── -->
    <div class="p-5 space-y-4">
      <!-- Dashboard Info card -->
      <div
        *ngIf="!isRenaming"
        class="flex items-center justify-between p-4 rounded-xl transition-all duration-150"
        style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
      >
        <div class="flex items-center gap-3">
          <div
            class="dmm-icon-wrap w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
          >
            <lucide-icon
              *ngIf="dashboardIconService.getIcon(dashboard.iconId) as icon"
              [img]="icon"
              [size]="22"
              style="color: var(--accent-primary)"
            ></lucide-icon>
          </div>
          <div>
            <h3 class="font-semibold text-sm" style="color: var(--text-primary)">
              {{ dashboard.name }}
            </h3>
            <p class="text-xs mt-0.5" style="color: var(--text-muted)">
              {{ dashboard.isDefault ? 'Default Dashboard' : 'Custom Dashboard' }}
            </p>
          </div>
        </div>
        <button
          (click)="startRename()"
          class="p-2 rounded-lg cursor-pointer transition-all duration-150 hover:opacity-70"
          style="
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            background: var(--bg-overlay);
          "
          title="Rename"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            />
          </svg>
        </button>
      </div>

      <!-- Rename Form -->
      <div *ngIf="isRenaming" class="space-y-4">
        <div>
          <label
            class="block text-xs font-semibold mb-1.5 uppercase tracking-wide"
            style="color: var(--text-secondary)"
            >Dashboard Name</label
          >
          <input
            type="text"
            [(ngModel)]="newName"
            class="w-full px-3 py-2 rounded-xl text-sm transition-all duration-150 outline-none focus:ring-2"
            style="
              background: var(--bg-input);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold mb-2 uppercase tracking-wide"
            style="color: var(--text-secondary)"
            >Choose Icon</label
          >
          <!-- Category Filter -->
          <div class="flex flex-wrap gap-1.5 mb-3">
            <button
              *ngFor="let cat of categories"
              (click)="selectedCategory = cat"
              type="button"
              class="px-2.5 py-1 text-xs font-semibold rounded-full cursor-pointer transition-all duration-150"
              [style.background]="
                selectedCategory === cat ? 'var(--accent-primary)' : 'var(--bg-overlay)'
              "
              [style.color]="selectedCategory === cat ? '#fff' : 'var(--text-muted)'"
              [style.border]="selectedCategory === cat ? 'none' : '1px solid var(--border-subtle)'"
            >
              {{ cat }}
            </button>
          </div>
          <!-- Icon Grid -->
          <div class="grid grid-cols-6 gap-2 max-h-[130px] overflow-y-auto pr-1 dmm-scroll">
            <button
              *ngFor="let iconOpt of getFilteredIcons()"
              (click)="selectedIconId = iconOpt.id"
              type="button"
              class="aspect-square p-2 rounded-lg border-2 transition-all duration-150 flex items-center justify-center cursor-pointer"
              [style.border-color]="
                selectedIconId === iconOpt.id ? 'var(--accent-primary)' : 'var(--border-subtle)'
              "
              [style.background]="
                selectedIconId === iconOpt.id ? 'var(--bg-overlay)' : 'transparent'
              "
              [title]="iconOpt.name"
            >
              <lucide-icon
                [img]="iconOpt.icon"
                [size]="18"
                [style.color]="
                  selectedIconId === iconOpt.id ? 'var(--accent-primary)' : 'var(--text-muted)'
                "
              ></lucide-icon>
            </button>
          </div>
        </div>

        <div class="flex gap-2">
          <button
            type="button"
            (click)="saveRename()"
            class="flex-1 py-2 rounded-xl text-sm font-bold cursor-pointer text-white transition-all duration-150 hover:opacity-90"
            style="background: var(--accent-gradient)"
          >
            Save
          </button>
          <button
            type="button"
            (click)="
              isRenaming = false; newName = dashboard.name; selectedIconId = dashboard.iconId
            "
            class="flex-1 py-2 rounded-xl text-sm font-semibold cursor-pointer transition-all duration-150 hover:opacity-80"
            style="
              background: var(--bg-overlay);
              color: var(--text-secondary);
              border: 1px solid var(--border-subtle);
            "
          >
            Cancel
          </button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="space-y-1" style="border-top: 1px solid var(--border-subtle); padding-top: 1rem">
        <button
          type="button"
          (click)="onDuplicate()"
          class="dmm-action w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left cursor-pointer transition-all duration-150"
          style="color: var(--text-primary)"
        >
          <svg
            class="w-4 h-4 flex-shrink-0"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
            />
          </svg>
          <span class="font-semibold text-sm">Duplicate Dashboard</span>
        </button>

        <button
          type="button"
          (click)="onShare()"
          class="dmm-action w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left cursor-pointer transition-all duration-150"
          style="color: var(--text-primary)"
        >
          <svg
            class="w-4 h-4 flex-shrink-0"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
            />
          </svg>
          <span class="font-semibold text-sm">Share Dashboard</span>
        </button>

        <button
          type="button"
          (click)="onDelete()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left cursor-pointer transition-all duration-150 hover:bg-red-500/10"
        >
          <svg
            class="w-4 h-4 flex-shrink-0 text-red-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
          <span class="font-semibold text-sm text-red-500">Delete Dashboard</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Share Modal -->
<app-share-modal
  *ngIf="showShareModal"
  [shareUrl]="getShareUrl()"
  [dashboardName]="dashboard.name"
  (close)="onShareClose()"
  (shareWithUser)="onShareWithUser($event)"
>
</app-share-modal>

<!-- Delete Confirmation Modal -->
<app-confirm-delete-modal
  *ngIf="showDeleteModal"
  [itemName]="dashboard.name"
  itemType="dashboard"
  (confirm)="onDeleteConfirm()"
  (cancel)="onDeleteCancel()"
>
</app-confirm-delete-modal>
