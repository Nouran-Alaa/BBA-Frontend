<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  "
  (click)="onClose()"
>
  <div
    class="rounded-xl shadow-2xl max-w-md w-full animate-slideUp"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="px-6 py-4 flex-shrink-0" style="border-bottom: 1px solid var(--border-subtle)">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold" style="color: var(--text-primary)">Dashboard Settings</h2>
        <button
          (click)="onClose()"
          class="w-8 h-8 rounded-lg transition-colors flex items-center justify-center cursor-pointer hover-glass"
          style="color: var(--text-muted)"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6 space-y-4">
      <!-- Dashboard Info -->
      <div *ngIf="!isRenaming">
        <div
          class="flex items-center justify-between p-4 rounded-lg"
          style="background: var(--bg-overlay); border: 1px solid var(--border-subtle)"
        >
          <div class="flex items-center gap-3">
            <lucide-icon
              *ngIf="dashboardIconService.getIcon(dashboard.iconId) as icon"
              [img]="icon"
              [size]="32"
              style="color: var(--accent-primary)"
            >
            </lucide-icon>
            <div>
              <h3 class="font-semibold" style="color: var(--text-primary)">{{ dashboard.name }}</h3>
              <p class="text-sm" style="color: var(--text-muted)">
                {{ dashboard.isDefault ? 'Default Dashboard' : 'Custom Dashboard' }}
              </p>
            </div>
          </div>
          <button
            (click)="startRename()"
            class="p-2 rounded-lg transition-colors cursor-pointer hover-glass"
            style="color: var(--text-muted)"
            title="Rename"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Rename Form -->
      <div *ngIf="isRenaming" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary)"
            >Dashboard Name</label
          >
          <input
            type="text"
            [(ngModel)]="newName"
            class="w-full px-4 py-2 rounded-lg"
            style="
              background: var(--bg-input);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary)">
            Choose Icon
          </label>

          <!-- Category Filter -->
          <div class="flex flex-wrap gap-1.5 mb-3">
            <button
              *ngFor="let cat of categories"
              (click)="selectedCategory = cat"
              type="button"
              class="px-2.5 py-1 text-xs font-medium rounded-full transition-all"
              [style.background]="
                selectedCategory === cat ? 'var(--accent-primary)' : 'var(--bg-overlay)'
              "
              [style.color]="selectedCategory === cat ? '#fff' : 'var(--text-muted)'"
              [style.border]="selectedCategory === cat ? 'none' : '1px solid var(--border-subtle)'"
            >
              {{ cat }}
            </button>
          </div>

          <!-- Icon Grid -->
          <div class="grid grid-cols-6 gap-2 max-h-[130px] overflow-y-auto pr-1">
            <button
              *ngFor="let iconOpt of getFilteredIcons()"
              (click)="selectedIconId = iconOpt.id"
              type="button"
              class="aspect-square p-2 rounded-lg border-2 transition-all flex items-center justify-center hover-glass cursor-pointer"
              [style.border-color]="
                selectedIconId === iconOpt.id ? 'var(--accent-primary)' : 'var(--border-subtle)'
              "
              [style.background]="
                selectedIconId === iconOpt.id ? 'var(--bg-overlay)' : 'transparent'
              "
              [title]="iconOpt.name"
            >
              <lucide-icon
                [img]="iconOpt.icon"
                [size]="20"
                [style.color]="
                  selectedIconId === iconOpt.id ? 'var(--accent-primary)' : 'var(--text-primary)'
                "
              >
              </lucide-icon>
            </button>
          </div>
        </div>

        <div class="flex gap-2">
          <button
            type="button"
            (click)="saveRename()"
            class="flex-1 py-2 rounded-lg font-medium cursor-pointer text-white hover:opacity-90"
            style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
          >
            Save
          </button>
          <button
            type="button"
            (click)="
              isRenaming = false; newName = dashboard.name; selectedIconId = dashboard.iconId
            "
            class="flex-1 py-2 rounded-lg font-medium cursor-pointer hover-glass"
            style="
              background: var(--bg-overlay);
              color: var(--text-secondary);
              border: 1px solid var(--border-subtle);
            "
          >
            Cancel
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="space-y-1" style="border-top: 1px solid var(--border-subtle); padding-top: 1rem">
        <!-- Duplicate -->
        <button
          type="button"
          (click)="onDuplicate()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover-glass transition-colors text-left cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
            ></path>
          </svg>
          <span class="font-medium" style="color: var(--text-primary)">Duplicate Dashboard</span>
        </button>

        <!-- Share -->
        <button
          type="button"
          (click)="onShare()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover-glass transition-colors text-left cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
            ></path>
          </svg>
          <span class="font-medium" style="color: var(--text-primary)">Share Dashboard</span>
        </button>

        <!-- Delete -->
        <button
          type="button"
          (click)="onDelete()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-red-500/10 transition-colors text-left cursor-pointer"
        >
          <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            ></path>
          </svg>
          <span class="font-medium text-red-600">Delete Dashboard</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Share Modal -->
<app-share-modal
  *ngIf="showShareModal"
  [shareUrl]="getShareUrl()"
  [dashboardName]="dashboard.name"
  (close)="onShareClose()"
  (shareWithUser)="onShareWithUser($event)"
>
</app-share-modal>

<!-- Delete Confirmation Modal -->
<app-confirm-delete-modal
  *ngIf="showDeleteModal"
  [itemName]="dashboard.name"
  itemType="dashboard"
  (confirm)="onDeleteConfirm()"
  (cancel)="onDeleteCancel()"
>
</app-confirm-delete-modal>
