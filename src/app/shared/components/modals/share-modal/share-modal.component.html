<!-- share-modal.component.html — space theme -->
<div
  class="fixed inset-0 z-[60] flex items-center justify-center p-4"
  style="
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  "
  (click)="onClose()"
>
  <div
    class="sm-panel relative w-full max-w-md rounded-2xl overflow-hidden shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- HUD corner brackets -->
    <div class="sm-corner sm-tl" aria-hidden="true"></div>
    <div class="sm-corner sm-tr" aria-hidden="true"></div>
    <div class="sm-corner sm-bl" aria-hidden="true"></div>
    <div class="sm-corner sm-br" aria-hidden="true"></div>

    <!-- ── Header (gradient) ─────────────────────────────────── -->
    <div class="sm-header relative px-5 py-4 text-white flex-shrink-0 overflow-hidden">
      <div class="sm-header-shimmer" aria-hidden="true"></div>
      <div class="relative flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
            style="
              background: rgba(255, 255, 255, 0.2);
              border: 1px solid rgba(255, 255, 255, 0.25);
            "
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
              />
            </svg>
          </div>
          <div>
            <p class="text-[0.6rem] font-bold uppercase tracking-[0.13em] text-white/60">
              Share Dashboard
            </p>
            <h2 class="text-base font-extrabold leading-tight">{{ dashboardName }}</h2>
          </div>
        </div>
        <button
          (click)="onClose()"
          class="w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer transition-all duration-150 hover:bg-white/20"
          style="background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2)"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Body ─────────────────────────────────────────────── -->
    <div class="p-5 space-y-4" style="background: var(--bg-modal)">
      <!-- Tab bar -->
      <div class="flex gap-1 p-1 rounded-xl" style="background: var(--bg-overlay)">
        <button
          (click)="showUserShare = false"
          class="flex-1 py-1.5 rounded-lg text-sm font-semibold cursor-pointer transition-all duration-150"
          [style.background]="!showUserShare ? 'var(--bg-card)' : 'transparent'"
          [style.color]="!showUserShare ? 'var(--text-primary)' : 'var(--text-muted)'"
          [style.box-shadow]="!showUserShare ? '0 1px 4px rgba(0,0,0,.12)' : 'none'"
        >
          Share Link
        </button>
        <button
          (click)="showUserShare = true"
          class="flex-1 py-1.5 rounded-lg text-sm font-semibold cursor-pointer transition-all duration-150"
          [style.background]="showUserShare ? 'var(--bg-card)' : 'transparent'"
          [style.color]="showUserShare ? 'var(--text-primary)' : 'var(--text-muted)'"
          [style.box-shadow]="showUserShare ? '0 1px 4px rgba(0,0,0,.12)' : 'none'"
        >
          Share with User
        </button>
      </div>

      <!-- Share Link -->
      <div *ngIf="!showUserShare" class="space-y-3">
        <p class="text-xs" style="color: var(--text-secondary)">
          Anyone with this link can view this dashboard:
        </p>

        <div class="flex items-center gap-2">
          <input
            type="text"
            [value]="shareUrl"
            readonly
            class="flex-1 px-3 py-2 rounded-xl text-xs font-mono truncate"
            style="
              background: var(--bg-overlay);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          />
          <button
            (click)="copyToClipboard()"
            class="sm-copy-btn flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-bold text-white cursor-pointer transition-all duration-150 hover:opacity-90 flex-shrink-0"
            [style.background]="copied ? '#10b981' : 'var(--accent-gradient)'"
          >
            <svg
              *ngIf="!copied"
              class="w-3.5 h-3.5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
              />
            </svg>
            <svg
              *ngIf="copied"
              class="w-3.5 h-3.5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M5 13l4 4L19 7"
              />
            </svg>
            {{ copied ? 'Copied!' : 'Copy' }}
          </button>
        </div>

        <div
          class="flex items-start gap-2.5 p-3 rounded-xl text-xs"
          style="
            background: var(--bg-overlay);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
          "
        >
          <svg
            class="w-4 h-4 flex-shrink-0 mt-px"
            style="color: var(--accent-primary)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          View-only access. Recipients cannot edit.
        </div>
      </div>

      <!-- Share with User -->
      <div *ngIf="showUserShare" class="space-y-3">
        <p class="text-xs" style="color: var(--text-secondary)">Invite someone to collaborate:</p>

        <div>
          <label
            class="block text-xs font-semibold mb-1.5 uppercase tracking-wide"
            style="color: var(--text-secondary)"
            >Email Address</label
          >
          <input
            type="email"
            [(ngModel)]="userEmail"
            placeholder="colleague@company.com"
            class="w-full px-3 py-2 rounded-xl text-sm outline-none"
            style="
              background: var(--bg-overlay);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold mb-2 uppercase tracking-wide"
            style="color: var(--text-secondary)"
            >Permission Level</label
          >
          <div class="space-y-2">
            <label
              *ngFor="
                let perm of [
                  { value: 'view', label: 'Can View', desc: 'View dashboard and widgets' },
                  { value: 'edit', label: 'Can Edit', desc: 'View and modify dashboard' },
                ]
              "
              class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all duration-150"
              [style.border]="
                '1px solid ' +
                (selectedPermission === perm.value
                  ? 'var(--accent-primary)'
                  : 'var(--border-subtle)')
              "
              [style.background]="
                selectedPermission === perm.value ? 'var(--bg-overlay)' : 'transparent'
              "
            >
              <input
                type="radio"
                [(ngModel)]="selectedPermission"
                [value]="perm.value"
                class="w-4 h-4 accent-[var(--accent-primary)]"
              />
              <div class="flex-1">
                <p class="font-semibold text-sm" style="color: var(--text-primary)">
                  {{ perm.label }}
                </p>
                <p class="text-xs" style="color: var(--text-muted)">{{ perm.desc }}</p>
              </div>
            </label>
          </div>
        </div>

        <button
          (click)="onShareWithUser()"
          [disabled]="!userEmail.trim()"
          class="w-full py-2 rounded-xl text-sm font-bold text-white cursor-pointer transition-all duration-150 hover:opacity-90 disabled:opacity-40"
          style="background: var(--accent-gradient)"
        >
          Send Invitation
        </button>
      </div>
    </div>

    <!-- ── Footer ────────────────────────────────────────────── -->
    <div
      class="flex justify-end px-5 py-4"
      style="border-top: 1px solid var(--border-subtle); background: var(--bg-modal)"
    >
      <button
        (click)="onClose()"
        class="px-5 py-2 rounded-xl text-sm font-semibold cursor-pointer transition-all duration-150 hover:opacity-80"
        style="
          background: var(--bg-overlay);
          color: var(--text-secondary);
          border: 1px solid var(--border-subtle);
        "
      >
        Close
      </button>
    </div>
  </div>
</div>
