<!-- edit-ai-modal.component.html — Space theme, Tailwind-first, functionality unchanged -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px)"
  (click)="onClose()"
>
  <div
    class="rounded-2xl shadow-2xl w-full max-w-4xl h-[85vh] overflow-hidden animate-slideUp flex flex-col"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- ── Header ──────────────────────────────────────────────── -->
    <div class="px-4 py-3 text-white flex-shrink-0" style="background: var(--accent-gradient)">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
          style="background: rgba(255, 255, 255, 0.2)"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="text-lg font-bold truncate">Edit with AI</h2>
          <p class="text-xs opacity-90">{{ widget.title }}</p>
        </div>
        <button
          (click)="onClose()"
          class="w-9 h-9 rounded-lg flex items-center justify-center cursor-pointer transition-all hover:bg-white/25 active:scale-95"
          style="background: rgba(255, 255, 255, 0.15)"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Chat messages ───────────────────────────────────────── -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4" style="background: var(--bg-secondary)">
      <div *ngFor="let message of chatMessages">
        <div class="flex gap-3" [class.flex-row-reverse]="message.role === 'user'">
          <!-- Avatar -->
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
            [style.background]="
              message.role === 'user' ? 'var(--accent-gradient)' : 'var(--bg-card)'
            "
          >
            <svg
              *ngIf="message.role === 'assistant'"
              class="w-5 h-5"
              style="color: var(--text-muted)"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
              />
            </svg>
            <svg
              *ngIf="message.role === 'user'"
              class="w-5 h-5 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>

          <!-- Bubble + preview -->
          <div class="flex-1 max-w-[85%]">
            <div
              class="px-4 py-2.5 rounded-2xl shadow-sm"
              [style.background]="
                message.role === 'user' ? 'var(--accent-gradient)' : 'var(--bg-card)'
              "
              [style.color]="
                message.role === 'user' ? 'var(--text-on-accent)' : 'var(--text-primary)'
              "
            >
              <p class="text-sm">{{ message.content }}</p>
            </div>

            <!-- Preview card -->
            <div
              *ngIf="message.role === 'assistant' && message.preview"
              class="mt-3 rounded-xl p-4"
              style="background: var(--bg-card); border: 2px solid var(--border-subtle)"
            >
              <div class="flex items-center justify-between mb-3">
                <h4 class="font-semibold text-sm" style="color: var(--text-primary)">
                  Updated Preview
                </h4>
                <button
                  (click)="applyChanges(message.preview)"
                  class="px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer text-white transition-all hover:-translate-y-px"
                  style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
                >
                  Apply Changes
                </button>
              </div>
              <div class="rounded-lg p-6" style="background: var(--bg-overlay)">
                <p class="text-sm" style="color: var(--text-secondary)">
                  {{ message.preview.title }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading spinner -->
      <div *ngIf="isGenerating" class="flex gap-3">
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center shadow animate-spin"
          style="background: var(--bg-card)"
        >
          <svg
            class="w-4 h-4"
            style="color: var(--text-muted)"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
            />
          </svg>
        </div>
        <div class="px-4 py-2.5 rounded-2xl shadow" style="background: var(--bg-card)">
          <p class="text-sm" style="color: var(--text-secondary)">Updating widget...</p>
        </div>
      </div>
    </div>

    <!-- ── Quick edits ──────────────────────────────────────────── -->
    <div
      *ngIf="chatMessages.length === 1"
      class="px-4 py-2 flex-shrink-0"
      style="background: var(--bg-card); border-top: 1px solid var(--border-subtle)"
    >
      <p class="text-xs font-medium mb-2" style="color: var(--text-secondary)">Quick edits:</p>
      <div class="flex gap-2 flex-wrap">
        <button
          *ngFor="let prompt of examplePrompts.slice(0, 4)"
          (click)="useExamplePrompt(prompt)"
          class="px-3 py-1.5 rounded-lg text-xs cursor-pointer transition-all hover:-translate-y-px"
          style="
            background: var(--bg-overlay);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
          "
          onmouseover="
            this.style.background = 'var(--accent-gradient)';
            this.style.color = 'var(--text-on-accent)';
            this.style.borderColor = 'transparent';
          "
          onmouseout="
            this.style.background = 'var(--bg-overlay)';
            this.style.color = 'var(--text-primary)';
            this.style.borderColor = 'var(--border-subtle)';
          "
        >
          {{ prompt }}
        </button>
      </div>
    </div>

    <!-- ── Input ───────────────────────────────────────────────── -->
    <div
      class="p-3 flex-shrink-0"
      style="border-top: 1px solid var(--border-subtle); background: var(--bg-card)"
    >
      <div class="flex gap-2 items-end">
        <textarea
          [(ngModel)]="userMessage"
          (keydown.enter)="handleEnterKey($event)"
          placeholder="Describe the changes..."
          rows="1"
          [disabled]="isGenerating"
          class="flex-1 px-3 py-2.5 rounded-xl resize-none text-sm focus:outline-none transition-all"
          style="
            min-height: 42px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
          "
        ></textarea>
        <button
          (click)="sendMessage()"
          [disabled]="!userMessage.trim() || isGenerating"
          class="h-[42px] px-5 rounded-xl font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 cursor-pointer text-white transition-all hover:-translate-y-px"
          style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            />
          </svg>
          <span class="hidden sm:inline">Send</span>
        </button>
      </div>
    </div>
  </div>
</div>
