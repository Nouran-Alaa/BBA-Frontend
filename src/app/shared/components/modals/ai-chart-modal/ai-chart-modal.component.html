<!--
  ai-chart-modal.component.html
  BASE = document 16 (original) — every line identical EXCEPT:
    1. Template card preview area (180px box):
       SVG icon replaced with real ECharts canvas. No colour frame.
       The chart-type badge (top-right) and all card content below are unchanged.
    2. Lucide icon replaces emoji in card footer & chat header.
    3. Chat message preview box (200px):
       SVG icon replaced with real ECharts canvas. Wrapper unchanged.
-->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px)"
  (click)="onClose()"
>
  <div
    class="rounded-2xl shadow-2xl overflow-hidden animate-slideUp flex w-full max-w-[1080px] h-[86vh]"
    style="background: var(--bg-modal); border: 1px solid var(--border-glass)"
    (click)="$event.stopPropagation()"
  >
    <!-- ══════════════════════════════════════════════════════════════════════
         TEMPLATE SELECTION VIEW
    ═══════════════════════════════════════════════════════════════════════ -->
    <div *ngIf="!showChat" class="flex-1 flex flex-col">
      <!-- ── Header — identical to original ──────────────────────────────── -->
      <div class="px-6 py-4 text-white flex-shrink-0" style="background: var(--accent-gradient)">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div
              class="w-12 h-12 rounded-xl flex items-center justify-center"
              style="background: rgba(255, 255, 255, 0.2)"
            >
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                ></path>
              </svg>
            </div>
            <div>
              <h2 class="text-2xl font-bold">Add Card</h2>
              <p class="text-sm opacity-90">Choose a template or create custom</p>
            </div>
          </div>
          <button
            (click)="onClose()"
            class="w-10 h-10 rounded-lg transition-colors flex items-center justify-center cursor-pointer hover:bg-white/20"
            style="background: rgba(255, 255, 255, 0.1)"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <!-- Search Bar — identical -->
        <div class="mt-4">
          <div class="relative">
            <svg
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
            <input
              type="text"
              [(ngModel)]="searchQuery"
              placeholder="Search templates..."
              class="modal-search-input w-full pl-12 pr-4 py-3 rounded-lg text-white placeholder-white/70 focus:outline-none transition-all font-medium"
              style="border: 1px solid rgba(255, 255, 255, 0.4)"
            />
          </div>
        </div>
      </div>

      <!-- ── Categories — identical to original ──────────────────────────── -->
      <div
        class="px-6 py-3 flex-shrink-0"
        style="border-bottom: 1px solid var(--border-subtle); background: var(--bg-card)"
      >
        <div class="flex gap-2 overflow-x-auto">
          <button
            *ngFor="let cat of categories"
            (click)="selectedCategory = cat"
            class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap transition-all cursor-pointer"
            [style.background]="
              selectedCategory === cat ? 'var(--accent-gradient)' : 'var(--bg-overlay)'
            "
            [style.color]="
              selectedCategory === cat ? 'var(--text-on-accent)' : 'var(--text-primary)'
            "
            [style.border]="
              '1px solid ' + (selectedCategory === cat ? 'transparent' : 'var(--border-subtle)')
            "
          >
            {{ cat }}
          </button>
        </div>
      </div>

      <!-- ── Templates Grid — identical layout & hover ────────────────────── -->
      <div class="flex-1 overflow-y-auto p-6" style="background: var(--bg-secondary)">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto">
          <button
            *ngFor="let template of getFilteredTemplates()"
            (click)="selectTemplate(template)"
            class="glass rounded-xl overflow-hidden transition-all text-left group flex flex-col h-full cursor-pointer"
            style="border: 2px solid var(--border-subtle)"
            onmouseover="
              this.style.borderColor = 'var(--accent-primary)';
              this.style.transform = 'translateY(-4px)';
              this.style.boxShadow = 'var(--shadow-lg)';
            "
            onmouseout="
              this.style.borderColor = 'var(--border-subtle)';
              this.style.transform = 'translateY(0)';
              this.style.boxShadow = 'none';
            "
          >
            <!-- Chart preview: full-width ECharts, no padding, no colour frame -->
            <div class="relative overflow-hidden" style="height: 180px">
              <!-- Custom chart — creative "idea" illustration instead of echarts -->
              <div
                *ngIf="template.id === 'custom'"
                class="w-full h-full flex flex-col items-center justify-center gap-2"
                style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4c1d95 100%)"
              >
                <!-- Animated glow ring -->
                <div class="relative flex items-center justify-center">
                  <div
                    class="absolute w-20 h-20 rounded-full opacity-30 animate-ping"
                    style="
                      background: radial-gradient(circle, #a78bfa, transparent 70%);
                      animation-duration: 2s;
                    "
                  ></div>
                  <div
                    class="absolute w-14 h-14 rounded-full opacity-20"
                    style="background: radial-gradient(circle, #c4b5fd, transparent 70%)"
                  ></div>
                  <!-- Lamp SVG -->
                  <svg
                    width="52"
                    height="52"
                    viewBox="0 0 52 52"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <!-- Glow -->
                    <circle cx="26" cy="22" r="15" fill="url(#lampGlow)" opacity="0.5" />
                    <!-- Bulb body -->
                    <path
                      d="M18 22c0-4.418 3.582-8 8-8s8 3.582 8 8c0 3.07-1.728 5.738-4.273 7.12L29 32H23l-.727-2.88C19.728 27.738 18 25.07 18 22z"
                      fill="url(#bulbGrad)"
                    />
                    <!-- Filament glow lines -->
                    <path
                      d="M23 29l1.5-4 2 2 1.5-4"
                      stroke="#fde68a"
                      stroke-width="1"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      opacity="0.8"
                    />
                    <!-- Base rings -->
                    <rect x="22" y="32" width="8" height="2" rx="1" fill="#c4b5fd" />
                    <rect x="22.5" y="35" width="7" height="2" rx="1" fill="#a78bfa" />
                    <rect x="24" y="38" width="4" height="1.5" rx="0.75" fill="#8b5cf6" />
                    <!-- Sparkle dots -->
                    <circle cx="12" cy="14" r="1.5" fill="#fde68a" opacity="0.9" />
                    <circle cx="40" cy="12" r="1" fill="#c4b5fd" opacity="0.8" />
                    <circle cx="38" cy="30" r="1.2" fill="#fde68a" opacity="0.7" />
                    <circle cx="14" cy="28" r="1" fill="#a78bfa" opacity="0.8" />
                    <circle cx="26" cy="8" r="1.5" fill="#fde68a" opacity="0.6" />
                    <defs>
                      <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#fde68a" />
                        <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
                      </radialGradient>
                      <linearGradient
                        id="bulbGrad"
                        x1="18"
                        y1="14"
                        x2="34"
                        y2="38"
                        gradientUnits="userSpaceOnUse"
                      >
                        <stop offset="0%" stop-color="#fde68a" />
                        <stop offset="60%" stop-color="#c4b5fd" />
                        <stop offset="100%" stop-color="#7c3aed" />
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
                <p class="text-xs font-semibold tracking-wide" style="color: #c4b5fd">
                  Describe your chart
                </p>
              </div>

              <!-- Stat Card preview — animated glowy mockup -->
              <div
                *ngIf="template.id === 'stat-card'"
                class="sc-preview-wrap w-full h-full relative overflow-hidden"
              >
                <!-- Animated ambient orbs -->
                <div class="sc-orb sc-orb-1"></div>
                <div class="sc-orb sc-orb-2"></div>
                <div class="sc-orb sc-orb-3"></div>
                <!-- Grid scanline overlay -->
                <div class="sc-grid-overlay"></div>
                <!-- Content -->
                <div class="relative z-10 w-full h-full flex flex-col justify-between p-4">
                  <!-- Top: logo + label -->
                  <div class="flex items-center gap-2">
                    <div class="sc-logo-badge">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
                        <path
                          d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.791-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.885v2.27h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"
                        />
                      </svg>
                    </div>
                    <span class="sc-label-text">Facebook Conversations</span>
                  </div>
                  <!-- Middle: big animated number -->
                  <div class="flex flex-col gap-0.5">
                    <span class="sc-sublabel">Total Mentions</span>
                    <span class="sc-big-number sc-count-anim">39,571</span>
                  </div>
                  <!-- Bottom: change pill + sparkline dots -->
                  <div class="flex items-center justify-between">
                    <div class="sc-change-pill sc-change-down">
                      <svg
                        class="w-2.5 h-2.5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M19 14l-7 7-7-7"
                        />
                      </svg>
                      <span>-2%</span>
                    </div>
                    <!-- Tiny sparkline dots -->
                    <div class="flex items-end gap-0.5 h-4">
                      <div class="sc-spark" style="height: 40%"></div>
                      <div class="sc-spark" style="height: 65%"></div>
                      <div class="sc-spark" style="height: 50%"></div>
                      <div class="sc-spark" style="height: 80%"></div>
                      <div class="sc-spark" style="height: 60%"></div>
                      <div class="sc-spark" style="height: 90%"></div>
                      <div class="sc-spark sc-spark-active" style="height: 70%"></div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- All other charts: ECharts preview -->
              <div
                *ngIf="template.id !== 'custom' && template.id !== 'stat-card'"
                echarts
                [options]="previewOptions[template.preview] || {}"
                [initOpts]="svgOpts"
                [autoResize]="true"
                class="tpl-chart-host"
              ></div>

              <!-- Chart-type badge — identical position to original -->
              <span
                class="absolute top-3 right-3 px-2 py-1 text-[10px] font-semibold rounded shadow text-white"
                style="background: var(--accent-gradient)"
              >
                {{ template.chartType }}
              </span>
            </div>
            <!-- ── END CHANGED ── -->

            <!-- Card body — identical to original, emoji → Lucide icon -->
            <div class="p-5 flex-1 flex flex-col">
              <div class="flex items-start gap-3 mb-3">
                <!-- Lucide icon in a tinted badge (replaces the emoji) -->
                <div
                  class="w-10 h-10 rounded-lg flex-shrink-0 flex items-center justify-center"
                  [style.background]="(template.categoryColor || '#6366f1') + '22'"
                >
                  <lucide-icon
                    [img]="template.lucideIcon"
                    [size]="18"
                    [style.color]="template.categoryColor || '#6366f1'"
                  >
                  </lucide-icon>
                </div>
                <div class="flex-1 min-w-0">
                  <h3
                    class="font-semibold mb-1 group-hover:text-blue-600 transition-colors"
                    style="color: var(--text-primary)"
                  >
                    {{ template.title }}
                  </h3>
                  <p class="text-xs line-clamp-2" style="color: var(--text-secondary)">
                    {{ template.description }}
                  </p>
                </div>
              </div>

              <div class="mt-auto pt-3" style="border-top: 1px solid var(--border-subtle)">
                <p class="text-[10px] italic line-clamp-1" style="color: var(--text-muted)">
                  "{{ template.examplePrompts[0] }}"
                </p>
              </div>
              <div class="mt-2">
                <span
                  class="px-2 py-1 text-[10px] font-semibold rounded"
                  [style.background]="(template.categoryColor || '#6366f1') + '18'"
                  [style.color]="template.categoryColor || '#6366f1'"
                >
                  {{ template.category }}
                </span>
              </div>
            </div>
          </button>
        </div>

        <div *ngIf="getFilteredTemplates().length === 0" class="text-center py-16">
          <p style="color: var(--text-muted)">No templates found</p>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════════════
         CHAT VIEW — identical to original
    ═══════════════════════════════════════════════════════════════════════ -->
    <div *ngIf="showChat" class="flex-1 flex flex-col">
      <!-- Chat Header — identical; emoji → Lucide icon -->
      <div class="px-4 py-3 text-white flex-shrink-0" style="background: var(--accent-gradient)">
        <div class="flex items-center gap-3">
          <button
            (click)="backToTemplates()"
            class="w-9 h-9 rounded-lg transition-colors flex items-center justify-center cursor-pointer"
            style="background: rgba(255, 255, 255, 0.15)"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
          </button>
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <!-- Lucide icon in a translucent badge -->
            <div
              class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
              style="background: rgba(255, 255, 255, 0.2)"
            >
              <lucide-icon
                *ngIf="selectedTemplate?.lucideIcon"
                [img]="selectedTemplate!.lucideIcon"
                [size]="18"
                class="text-white"
              >
              </lucide-icon>
            </div>
            <div class="min-w-0">
              <h2 class="text-lg font-bold truncate">{{ selectedTemplate?.title }}</h2>
              <p class="text-xs opacity-90">{{ selectedTemplate?.chartType }}</p>
            </div>
          </div>
          <button
            (click)="onClose()"
            class="w-9 h-9 rounded-lg transition-colors flex items-center justify-center flex-shrink-0 cursor-pointer"
            style="background: rgba(255, 255, 255, 0.15)"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Chat Messages — identical except preview box uses ECharts -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4" style="background: var(--bg-secondary)">
        <div *ngFor="let message of chatMessages">
          <div [class.flex-row-reverse]="message.role === 'user'" class="flex gap-3">
            <div
              class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
              [style.background]="
                message.role === 'user' ? 'var(--accent-gradient)' : 'var(--bg-card)'
              "
            >
              <svg
                *ngIf="message.role === 'assistant'"
                class="w-5 h-5"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
                ></path>
              </svg>
              <svg
                *ngIf="message.role === 'user'"
                class="w-5 h-5 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
            </div>

            <div class="flex-1 max-w-[85%]">
              <div
                class="px-4 py-2.5 rounded-2xl shadow-sm"
                [style.background]="
                  message.role === 'user' ? 'var(--accent-gradient)' : 'var(--bg-card)'
                "
                [style.color]="
                  message.role === 'user' ? 'var(--text-on-accent)' : 'var(--text-primary)'
                "
              >
                <p class="text-sm">{{ message.content }}</p>
              </div>

              <!-- ── CHANGED: Chart Preview box — ECharts instead of SVG ── -->
              <div
                *ngIf="message.role === 'assistant' && message.preview"
                class="mt-3 glass rounded-xl p-4"
                style="border: 2px solid var(--border-subtle)"
              >
                <div class="flex items-center justify-between mb-3">
                  <h4 class="font-semibold text-sm" style="color: var(--text-primary)">
                    Chart Preview
                  </h4>
                  <button
                    (click)="addPreviewToDashboard(message.preview)"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer text-white"
                    style="background: var(--accent-gradient); box-shadow: var(--shadow-sm)"
                  >
                    Add to Dashboard
                  </button>
                </div>
                <!-- ECharts preview (chart templates) -->
                <div
                  *ngIf="selectedTemplate?.gridItemType !== 'count-card'"
                  class="rounded-lg overflow-hidden"
                  style="height: 200px"
                >
                  <div
                    echarts
                    [options]="chatPreviewOption"
                    [initOpts]="canvasOpts"
                    [autoResize]="true"
                    class="chat-chart-host"
                  ></div>
                </div>
                <!-- Stat-card chat preview — animated glowy mockup -->
                <div
                  *ngIf="selectedTemplate?.gridItemType === 'count-card'"
                  class="sc-chat-preview-wrap rounded-lg overflow-hidden relative"
                  style="height: 200px"
                >
                  <!-- Ambient orbs -->
                  <div class="sc-orb sc-orb-1"></div>
                  <div class="sc-orb sc-orb-2"></div>
                  <div class="sc-orb sc-orb-3"></div>
                  <div class="sc-grid-overlay"></div>
                  <!-- Content -->
                  <div class="relative z-10 w-full h-full flex flex-col justify-between p-5">
                    <!-- Top row: logo + platform label + subtitle -->
                    <div class="flex items-start justify-between">
                      <div class="flex items-center gap-2.5">
                        <div class="sc-logo-badge sc-logo-badge-lg">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <path
                              d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.791-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.885v2.27h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"
                            />
                          </svg>
                        </div>
                        <div>
                          <p class="sc-label-text sc-label-text-lg">Facebook</p>
                          <p class="sc-sublabel">Total Conversations</p>
                        </div>
                      </div>
                      <!-- Live pulse indicator -->
                      <div class="flex items-center gap-1">
                        <div class="sc-live-dot"></div>
                        <span class="sc-sublabel">Live</span>
                      </div>
                    </div>
                    <!-- Big animated number -->
                    <div class="flex flex-col gap-1">
                      <span class="sc-big-number sc-big-number-xl sc-count-anim">39,571</span>
                      <div class="sc-number-underline"></div>
                    </div>
                    <!-- Bottom: change pill + mini bar chart -->
                    <div class="flex items-center justify-between">
                      <div class="sc-change-pill sc-change-down">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="3"
                            d="M19 14l-7 7-7-7"
                          />
                        </svg>
                        <span>-2% vs last week</span>
                      </div>
                      <!-- Mini bar chart -->
                      <div class="flex items-end gap-0.5 h-6">
                        <div class="sc-bar" style="height: 35%"></div>
                        <div class="sc-bar" style="height: 55%"></div>
                        <div class="sc-bar" style="height: 45%"></div>
                        <div class="sc-bar" style="height: 75%"></div>
                        <div class="sc-bar" style="height: 60%"></div>
                        <div class="sc-bar" style="height: 85%"></div>
                        <div class="sc-bar sc-bar-active" style="height: 65%"></div>
                        <div class="sc-bar" style="height: 90%"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- ── END CHANGED ── -->
            </div>
          </div>
        </div>

        <!-- Loading — identical to original -->
        <div *ngIf="isGenerating" class="flex gap-3">
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center shadow"
            style="background: var(--bg-card)"
          >
            <div class="animate-spin">
              <svg
                class="w-4 h-4"
                style="color: var(--text-muted)"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                ></path>
              </svg>
            </div>
          </div>
          <div class="px-4 py-2.5 rounded-2xl shadow" style="background: var(--bg-card)">
            <p class="text-sm" style="color: var(--text-secondary)">Generating chart...</p>
          </div>
        </div>
      </div>

      <!-- Quick Examples — identical to original -->
      <div
        *ngIf="chatMessages.length === 1 && selectedTemplate"
        class="px-4 py-2 flex-shrink-0"
        style="background: var(--bg-card); border-top: 1px solid var(--border-subtle)"
      >
        <p class="text-xs font-medium mb-2" style="color: var(--text-secondary)">Quick examples:</p>
        <div class="flex gap-2 flex-wrap">
          <button
            *ngFor="let prompt of selectedTemplate.examplePrompts.slice(0, 3)"
            (click)="useExamplePrompt(prompt)"
            class="px-3 py-1.5 rounded-lg text-xs transition-colors cursor-pointer"
            style="
              background: var(--bg-overlay);
              color: var(--text-primary);
              border: 1px solid var(--border-subtle);
            "
            onmouseover="
              this.style.background = 'var(--accent-gradient)';
              this.style.color = 'var(--text-on-accent)';
              this.style.borderColor = 'transparent';
            "
            onmouseout="
              this.style.background = 'var(--bg-overlay)';
              this.style.color = 'var(--text-primary)';
              this.style.borderColor = 'var(--border-subtle)';
            "
          >
            {{ prompt }}
          </button>
        </div>
      </div>

      <!-- Chat Input — identical to original -->
      <div
        class="p-3 flex-shrink-0"
        style="border-top: 1px solid var(--border-subtle); background: var(--bg-card)"
      >
        <div class="flex gap-2 items-end">
          <textarea
            [(ngModel)]="userMessage"
            (keydown.enter)="handleEnterKey($event)"
            placeholder="Describe what you want..."
            rows="1"
            [disabled]="isGenerating"
            class="flex-1 px-3 py-2 rounded-xl focus:outline-none resize-none text-sm max-h-32"
            style="
              min-height: 42px;
              background: var(--bg-input);
              border: 1px solid var(--border-subtle);
              color: var(--text-primary);
            "
          >
          </textarea>
          <button
            (click)="sendMessage()"
            [disabled]="!userMessage.trim() || isGenerating"
            class="h-[42px] px-5 rounded-xl font-medium shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 cursor-pointer text-white"
            style="background: var(--accent-gradient)"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
              ></path>
            </svg>
            <span class="hidden sm:inline">Send</span>
          </button>
        </div>
      </div>
    </div>
    <!-- end chat view -->
  </div>
</div>
