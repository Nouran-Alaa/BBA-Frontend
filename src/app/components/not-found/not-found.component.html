<div class="min-h-screen flex items-center justify-center p-4" style="background: transparent">
  <div class="max-w-2xl w-full text-center">
    <!-- Animated 404 -->
    <div class="mb-8 relative">
      <div
        class="text-[180px] font-black leading-none tracking-tighter opacity-20"
        style="
          background: var(--accent-gradient);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        "
      >
        404
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div
          class="w-32 h-32 rounded-full flex items-center justify-center animate-pulse"
          style="background: var(--accent-gradient); box-shadow: 0 0 60px rgba(0, 150, 200, 0.4)"
        >
          <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Message -->
    <div class="glass rounded-2xl p-8 mb-8">
      <h1 class="text-4xl font-bold mb-4" style="color: var(--text-primary)">
        Oops! Page Not Found
      </h1>
      <p class="text-lg mb-6" style="color: var(--text-secondary)">
        The page you're looking for seems to have wandered off into the data void. Don't worry,
        we'll help you get back on track!
      </p>

      <!-- Quick Actions -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button
          (click)="goHome()"
          class="px-6 py-3 rounded-lg font-medium text-white cursor-pointer flex items-center gap-2 justify-center transition-transform hover:scale-105"
          style="background: var(--accent-gradient); box-shadow: var(--shadow-md)"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          Go to Dashboard
        </button>
        <button
          (click)="goBack()"
          class="px-6 py-3 rounded-lg font-medium cursor-pointer flex items-center gap-2 justify-center transition-colors hover-glass"
          style="
            background: var(--bg-overlay);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
          "
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          Go Back
        </button>
      </div>
    </div>

    <!-- Helpful Links -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <a
        (click)="goToDashboards()"
        class="glass rounded-xl p-6 transition-all cursor-pointer hover:scale-105"
        style="border: 1px solid var(--border-subtle)"
      >
        <svg
          class="w-10 h-10 mx-auto mb-3"
          style="color: var(--accent-primary)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
          ></path>
        </svg>
        <h3 class="font-semibold mb-1" style="color: var(--text-primary)">Dashboards</h3>
        <p class="text-xs" style="color: var(--text-muted)">View your analytics</p>
      </a>

      <a
        (click)="goToProfile()"
        class="glass rounded-xl p-6 transition-all cursor-pointer hover:scale-105"
        style="border: 1px solid var(--border-subtle)"
      >
        <svg
          class="w-10 h-10 mx-auto mb-3"
          style="color: var(--accent-primary)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <h3 class="font-semibold mb-1" style="color: var(--text-primary)">Profile</h3>
        <p class="text-xs" style="color: var(--text-muted)">Manage your account</p>
      </a>

      <a
        (click)="goToSettings()"
        class="glass rounded-xl p-6 transition-all cursor-pointer hover:scale-105"
        style="border: 1px solid var(--border-subtle)"
      >
        <svg
          class="w-10 h-10 mx-auto mb-3"
          style="color: var(--accent-primary)"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          ></path>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          ></path>
        </svg>
        <h3 class="font-semibold mb-1" style="color: var(--text-primary)">Settings</h3>
        <p class="text-xs" style="color: var(--text-muted)">Configure options</p>
      </a>
    </div>
  </div>
</div>
